# 运行时的重试、上限与协调参数，运行流程见 ../prompts/weekly.md。
# coord.py、collect_all.py、fetch_articles.py、check_run.py、trace.py 读取本文件。

network:
  retries: 3                  # 单个请求失败后的重试次数
  backoff_seconds: 2          # 重试间隔 2、4、8 秒
  timeout_seconds: 40

articles:                     # fetch_articles.py 读取 HN 高分帖链接的原文
  min_points: 100             # 与 ranking.yaml 的 articles.min_points 一致
  max_articles: 40            # 每次运行最多读取的篇数
  max_bytes: 2000000          # 单页上限，超出部分丢弃
  timeout_seconds: 20
  retries: 2                  # 原文站点慢，重试少一些，避免拖长运行
  max_redirects: 3

digest:
  max_lines: 150              # digest.md 的行数上限；完整数据在 materials.json

search:
  min: 20                     # 联网搜索下限，check_run.py 检查
  max: 40                     # 上限

gates:
  max_rounds: 3               # 质量门槛不通过时最多返工的轮数

coordination:
  state_dir: 资讯/AI/数据/运行记录    # 状态文件：{state_dir}/{WEEK}.json
  branch: main
  max_attempts: 3             # 每周所有智能体合计的产出尝试上限，用完标为"需人工"
  run_lease_minutes: 60
  renew_below_minutes: 30     # 检查点上租约剩余不足此值就续期
  verify_lease_minutes: 20
  clock_skew_minutes: 5       # 判断租约过期时留出的时钟误差
  wait_poll_seconds: 60       # 等待时每次查询的间隔
  wait_call_max_seconds: 100  # 单次 wait 命令的最长时间：低于常见智能体命令默认 2 分钟的超时
  wait_max_minutes: 70        # 一次运行累计等待的上限
  push_retries: 5             # 推送被拒后重新读取、重新生成提交的次数

  publish:                    # coord.py publish 前的门槛检查，见 ../../文档/提案/2026-11-11-发布门槛与上线整改.md
    gate_timeout_seconds: 120 # 跑 check_run.py 的超时；超时或跑不起来按 check_failed 发布

trace:
  max_events_in_state: 400    # 状态文件里保留的事件条数（保留最新的）

# 运行时路径契约。这里只记录约定，真值源是 scripts/paths.py；
# 脚本、手册、提示词都不写路径字面量（见 ../scripts/paths.py）。
# 查询：python3 资讯/AI/工程/scripts/workdir.py print
paths:
  root_rule: "默认 <仓库检出目录父级>/.ai-weekly；部署级覆盖 AI_WEEKLY_HOME"
  work: "work/（本次运行 scratch，固定名，由 paths.work_dir 推导）"
  archive: "archive/{WEEK}/（一周一份；MANIFEST.json 的 runs[] 记多次运行）"
  state: "state/（跨运行状态，clean 不清；飞书防重与交付收据）"
  logs: "logs/（运行日志）"
  files: "中间文件名固定，见 paths.FILES；不追加周后缀、不按次数编号"
  legacy_override: "AI_WEEKLY_TMP 为过渡期兼容入口，PR 合并、旧任务停用后删除"
  note: "路径不合法时显式失败，不回退 /tmp；跨任务凭据观察由 credential_probe.state_path() 单独管理"
