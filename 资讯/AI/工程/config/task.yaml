# AI 资讯任务的能力、网络与路径清单。实际平台安排见部署指南，运行模式见 deployment.yaml。
# 本文件与执行手册只写平台无关的要求；各平台的对应做法见 ../../文档/部署指南.md。

task: ai-weekly
version: v0.8

schedule:                    # 未来启用调度时的参考，不会创建或启用平台任务
  cron: "0 10 * * 1"          # 每周一 10:00
  timezone: Asia/Shanghai
  report_period: 上一周（周一 00:00 至周日 24:00，北京时间）

agent:
  prompt: 资讯/AI/工程/prompts/routine-weekly.md   # 入口提示词，贴进定时任务
  manual: 资讯/AI/工程/prompts/weekly.md           # 执行手册，运行时从仓库读取
  model_tier: 高档通用模型，最高思考强度             # 不写具体型号，在平台设置中选择
  capabilities:                                    # 平台必须提供的能力
    - shell                     # 运行 bash 命令
    - python3                   # 带 PyYAML
    - network                   # 脚本访问 network.allow 中的站点，git 推送
    - git_push                  # 推送本仓库的 main：协调锁依赖它（见 ../core/coord.py），推送不了就无法运行
    - web_search                # 联网搜索
  optional_capabilities:                           # 没有时有降级办法
    - notify                    # 没有时把通知作为运行的最后输出，由调度方转发
  # 重试、搜索次数（20–40）、租约、等待等上限见 config/runtime.yaml

repository:
  name: slamslammo/personal_knowledge_manager
  branch: main                                 # 周报、数据和状态文件经 coord.py 直接推送到这里
  write_paths:                                 # 任务只能写入这些路径（coord.py 按当期路径提交）
    - 资讯/AI/数据/周报/
    - 资讯/AI/数据/月报/                             # 仅月报到期且手册要求生成时
    - 资讯/AI/数据/季报/                             # 仅季报到期且手册要求生成时
    - 资讯/AI/数据/github-weekly/
    - 资讯/AI/数据/运行记录/                     # 状态文件：协调锁与执行记录
  readonly_paths:
    - 资讯/AI/工程/
    - 资讯/AI/文档/
    - 资讯/AI/README.md
    - 资讯/README.md

runtime:
  requires: [git, python3, PyYAML]
  tests: python3 -m unittest discover -s 资讯/AI/工程/tests -t 资讯/AI/工程/tests

network:
  allow:
    - trendshift.io
    - api.ossinsight.io
    - hn.algolia.com
    - huggingface.co
    - github.com              # 推送本仓库
    - "*"                     # 原文读取：fetch_articles.py 读取 HN 高分帖链接的原文（只发 GET，有篇数和大小上限）；
                              # 不能放开全部域名的环境，原文读取会失败并降级，不影响其他采集
  known_blocked:
    - www.reddit.com          # 需要 OAuth 凭证

secrets:                      # 托管平台通常自动注入；自建调度时自行配置
  - name: git 推送凭证
    scope: 只对本仓库有内容写权限（细粒度 token 或部署密钥）

notify:
  banner_format: "【AI周报 W{WNUM}】<本周最重要的一件事>。"
  report_url: https://github.com/slamslammo/personal_knowledge_manager/blob/main/{URL 编码后的周报路径}
