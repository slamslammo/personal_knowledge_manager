# Agent 工程知识梳理

> 以 Datawhale Hello-Agents《从零开始构建智能体》为核心材料（下文统称“教材”，正文中的 1.2.2、第 9 章等编号均指它的章节），按知识之间的逻辑重新组织智能体（Agent）的核心知识。每个知识点说明它解决什么问题、机制如何运转、适用边界在哪里，并标明依据来源与核验状态。

## 知识路线

教材给出了一个简洁的定义：智能体是“在循环中自主调用工具的 LLM”（9.2.2）。它通过智能体循环与环境持续交互：感知新的观察，由大语言模型规划并选择工具，执行行动后再观察环境的变化（1.2.2）。本板块把模型之外、驱动这个循环运行的那层程序统称为**框架**（工程实践中也称 harness）：模型每一轮看到什么、声明如何被解析与执行、何时停止、留下什么记录，都由它决定，见[模型与框架的职责边界](node:responsibility)。

围绕这个定义，本板块把知识分为七个部分，前面的部分为后面的部分提供概念基础：

1. **智能体是什么**：定义、类型与演进脉络，以及大语言模型作为决策核心的能力与局限。
2. **运行机制**：循环如何一步步推进任务，推理与行动有哪些组织范式，任务如何正确地结束。
3. **行动：工具与协议**：智能体靠什么作用于外部世界，工具结果如何交还给模型，跨系统时如何标准化。
4. **信息：上下文、记忆与检索**：模型每一轮能看到什么，跨轮次、跨任务保留什么，外部知识如何按需取回。
5. **构建：框架与多智能体**：模型、工具、上下文与状态如何组织成可运行的系统，单个智能体不足时如何协作。
6. **验证与提升：评估与训练**：如何判断一个智能体或一次改动是变好还是变坏，以及如何持续提升。
7. **应用形态**：上述能力组合成哪些典型应用，各自的关键难点落在哪里。

<!--atlas-->

## 读者前提

本板块面向已具备 Python 与大模型 API 基础、并实际使用过编码类智能体工具（如 Claude Code、Codex）的读者。以下知识点默认读者已经掌握，在图谱中标为“读者前提”，本板块不重复展开；需要补充时请直接阅读教材对应小节（括号中的数字为教材小节号）：

- 智能体循环的基本结构（1.2.2、4.2）；
- 工具调用的基本机制：模型给出调用声明，由程序负责执行（4.2.2、7.5）；
- 上下文工程的基本概念与策略（第 9 章、Extra02）；
- 何时适合使用智能体、何时使用固定工作流（1.4.3）。

## 图谱状态

- **已发布**：已有正文，可以点击进入。
- **编写中**：边界已经确定，正文正在编写。
- **未展开**：已在体系中定位，暂未安排正文。
- **读者前提**：默认读者已经掌握，只保留位置与教材章节。

## 知识点的阅读方式

每个知识点按四层组织，可以只读到自己需要的深度：

1. **定位**：回答什么问题，在体系中的位置，需要哪些前置知识；
2. **核心解释**：2–5 分钟读完，讲清核心原理与关键结论；
3. **机制深挖**：对照教材代码、设计选项与失效情形展开；
4. **实验与原文**：可复现的实验（如有）与教材原文位置。

知识点末尾统一列出依据来源与核验状态，分级规则与引用写法见[参考资料](node:refs)。

# 智能体是什么

本部分回答：什么样的系统算智能体，它与一次性调用大语言模型、预设流程的工作流有什么不同，又是从哪里演进而来。后续各部分讨论的运行机制、工具、信息与评估，都建立在这里的定义之上。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 知识点

| 知识点 | 回答的问题 | 教材依据 | 状态 |
|---|---|---|---|
| [智能体的定义与构成](node:agentdef) | 什么样的系统算智能体；任务环境、感知与行动如何界定 | 1.1、1.2.1–1.2.3、2.4.4 | 已发布 |
| [智能体的类型](node:agenttypes) | 智能体可以从哪些维度分类，各类型的决策方式有何差异 | 1.1.1、1.1.3 | 已发布 |
| 智能体与工作流 | 自主决策的智能体与预设流程的工作流如何取舍 | 1.4.3 | 读者前提 |
| [从符号主义到大模型驱动](node:history) | 智能体经历了哪几次范式转变，每次解决了什么问题 | 第 2 章 | 已发布 |
| [大语言模型作为决策核心](node:llmcore) | 大语言模型为智能体提供了什么能力，又带来哪些局限 | 3.2、3.3；4.2.4、12.2.6 | 已发布 |

## 主线

传统智能体从依赖“条件—动作”规则的反射智能体起步，为了应对当前感知不足以支撑决策的环境，逐步发展出更复杂的决策架构（1.1.1）；[智能体的类型](node:agenttypes)沿三个维度梳理了这条谱系。大语言模型带来的变化在于，循环中的“思考”环节可以由模型用自然语言完成规划与工具选择（1.2.2），智能体因此能够处理事先无法穷举规则的开放任务——[智能体的定义与构成](node:agentdef)给出这套结构的完整定义，[从符号主义到大模型驱动](node:history)说明它是怎样演变到这一步的。

这种能力的边界也来自大语言模型本身。模型幻觉等局限（3.3）不会因为加上循环与工具而自动消失，而会在运行机制、信息管理与评估中以不同形式出现〔待核验〕；[大语言模型作为决策核心](node:llmcore)集中讨论这些能力与局限的来源。理解智能体，既要知道它能做什么，也要知道这些局限从哪里来。

## 与其他部分的关系

- 智能体循环如何具体运转、如何正确结束，见[运行机制](node:mechanism)。
- 如何判断智能体是否真正可靠，而不是只看单次演示，见[验证与提升](node:evaluation)。

<script type="text/markdown" data-node="agentdef">
# 智能体的定义与构成

## 定位

本节回答：什么样的系统算智能体，一个大语言模型驱动的智能体由哪些部分构成，它所处的任务环境有什么特点。这些定义是后续各部分讨论运行机制、工具、信息与评估的共同前提。

前置：智能体循环的基本结构（1.2.2、4.2），本节不再展开。文中的“框架”指模型之外、驱动循环运行的那层程序，见[模型与框架的职责边界](node:responsibility)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

教材给出了两个层次的定义。传统定义来自人工智能领域的既有框架：智能体是在任务环境中通过传感器感知、通过执行器行动的系统，任务环境用 PEAS 四要素描述——性能度量、环境、执行器、传感器（1.2.1）。工程定义则更直接：智能体是“在循环中自主调用工具的 LLM”（9.2.2）。

把两者合起来看，一个大语言模型驱动的智能体由三部分构成：

1. **决策核心**：大语言模型。在循环的“思考”环节完成两件事——把任务分解、更新对任务的理解（规划），以及从可用工具中选出下一步要用的工具和参数（工具选择）（1.2.2）。
2. **交互协议**：约定模型每一轮输出的结构。教材使用 `Thought`（把分析与规划用自然语言写出来）与 `Action`（要对环境施加的操作，通常写成函数调用）两段式（1.2.3）。
3. **外围程序**：解析器捕捉 `Action` 并调用对应的函数；感知系统把工具返回的原始数据加工成一段简洁的自然语言 `Observation`，作为下一轮的输入（1.2.3）。

这里有一个容易被定义掩盖的事实：在大语言模型智能体里，“传感器”和“执行器”都是程序。教材明确写到，`Action` 字段由一个外部解析器捕捉并调用相应函数，而感知系统“扮演传感器的角色”，把原始输出封装成观察（1.2.3）。模型并不直接接触环境，它能感知到什么、能做到什么，由框架决定。这条分界会在后面各部分反复出现。

教材还指出，智能体所处的数字环境有四个特性，每个特性都对设计提出要求（1.2.1）：

| 环境特性 | 教材的说明 | 对智能体设计的要求 |
|---|---|---|
| 部分可观察 | 查询航班时无法一次获取全部实时数据，只能看到接口返回的部分 | 需要记忆（记住已经查过什么）与探索（换条件再查） |
| 随机性 | 相邻两次调用返回的票价与余票都可能不同 | 需要处理不确定性、监控变化并及时决策 |
| 多智能体 | 其他用户、自动化脚本、动态调价系统都在改变环境 | 需要快速响应，并据此调整策略 |
| 序贯且动态 | 当前动作影响未来；环境在智能体决策时也在变化 | 循环必须能快速、灵活地适应变化 |

定义里的“自主”，指的是下一步做什么由模型在运行时决定，而不是由预先写死的流程决定；它不意味着模型可以越过框架直接行动〔待核验〕。

## 机制深挖

### 观察是被加工过的结果

教材在讲感知与行动时特别说明：工具返回的原始机器可读数据（如 JSON）通常包含模型无需关注的冗余信息，格式也不符合模型的处理习惯，因此感知系统要把它处理并封装成简洁、清晰的自然语言观察（1.2.3）。

这句话是[工具结果处理](node:toolresult)的出发点。模型看到的从来不是工具的原始返回，而是框架加工后的版本；加工方式（保留多少、丢掉什么、是否说明被截断）因此成为一个独立的工程问题。

### 同一个循环的两种画法

第 2 章在介绍大语言模型智能体时，把构成拆得更细：感知模块接收环境输入形成观察；规划模块通过反思与自我批判把宏观目标分解为可执行步骤；大语言模型结合记忆模块推理出下一步的工具调用；执行模块解析指令、从工具箱中选择工具并执行；工具结果与新的环境状态共同构成下一轮观察，同时触发记忆更新（2.4.4）。

与 1.2 节的三段式相比，这张图把记忆与规划单独列为模块。两者描述的是同一个循环，区别在于把哪些职责显式化。本板块沿用前一种划分，把记忆与进度记录放在[信息：上下文、记忆与检索](node:information)中讨论。

### 与一次性调用模型的区别

一次性调用模型只产生一次输出，输出即终点；智能体把模型输出变成可执行的声明，用执行结果驱动下一轮，直到满足停止条件。是否值得为一个任务引入这层循环，教材在 1.4.3 节讨论了工作流与智能体的差异，本板块不再展开。

## 实验与原文

教材 1.3 节用一个“5 分钟实现的最小智能体”完整展示了这条链路：提示词约定输出格式、循环调用模型、解析 `Action`、执行工具、把结果作为 `Observation` 写回历史（1.3.3），并给出一次三轮循环的完整运行输出（1.3.4）。本节未运行该示例。

## 与相邻知识点的关系

- 循环每一轮如何判断“结束还是继续”，见[终止判定的漏判](node:terminate)与[停止条件设计](node:stopcond)。
- 观察如何被加工、结果过大时如何交还给模型，见[工具结果处理](node:toolresult)。
- 部分可观察带来的记忆需求，在一次任务之内表现为[任务状态](node:taskstate)，跨任务则属于记忆系统。
- 解析与封装由框架承担，这一分工见[模型与框架的职责边界](node:responsibility)。

## 来源与核验

| 结论 | 依据位置 | 级别 |
|---|---|---|
| 任务环境用 PEAS 四要素描述，数字环境具有部分可观察、随机、多智能体、序贯动态四个特性 | 1.2.1 | 教材正文 |

| “自主”指下一步由模型在运行时决定，而非越过框架行动 | 由 1.2.3 与 9.2.2 的表述推导 | 待核验 |

# 智能体的类型

## 定位

本节回答：智能体可以从哪些维度分类，各类型的分界问题是什么，以及这些分类对工程选择有什么用。

前置：[智能体的定义与构成](node:agentdef)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

教材从三个互补的维度对智能体分类（1.1.3）。三个维度回答的是不同问题，可以叠加使用：

| 维度 | 谱系 | 分界问题 |
|---|---|---|
| 内部决策架构 | 反应式 → 模型式 → 基于目标 → 基于效用；学习能力是可叠加的元能力 | 决策依据是当前感知、内部状态、目标，还是多目标之间的权衡 |
| 时间与反应性 | 反应式 / 规划式 / 混合式 | 先行动还是先思考 |
| 知识表示 | 亚符号 / 符号 / 神经符号 | 决策依据是分布式的模式，还是可检查的符号 |

**内部决策架构**沿着一条能力阶梯展开（1.1.1）：简单反射智能体只做“条件—动作”的直接映射，不具备记忆与预测；基于模型的反射智能体引入世界模型，用于追踪无法被直接感知的部分；基于目标的智能体主动选择能导向目标的行动；基于效用的智能体为不同状态赋予效用值，在相互冲突的目标之间权衡。学习能力可以叠加在以上任何一类之上。

**时间与反应性**揭示的是速度与最优解之间的权衡（1.1.3）。反应式智能体延迟低、开销小，代价是“短视”，容易陷入局部最优；规划式智能体先系统地探索可能性再行动，优势是战略性与远见，代价是时间与计算成本，在快速变化的环境中可能错过时机；混合式结合两者，经典做法是分层——底层快速反应，高层审慎规划。

**知识表示**是更根本的一个维度（1.1.3）。亚符号（连接主义）把知识以统计模式分布在网络中，擅长模式识别、对噪声鲁棒，但是黑箱、逻辑推理弱，并会产生看似合理却事实错误的幻觉；符号主义把知识表示为人类可读的符号与规则，透明可追溯，但在现实世界的模糊与例外面前脆弱，存在知识获取瓶颈；神经符号试图结合两者，教材用《思考，快与慢》中的系统 1 与系统 2 作类比。

教材对大语言模型智能体在这两个维度上的定位很明确：

- 在时间维度上，它是混合式的一种新形态。“思考”是审议过程，“行动”与“观察”是反应过程，于是一个需要长远规划的大任务，被拆成一连串“规划—反应”的微循环（1.1.3）。
- 在知识表示维度上，它是神经符号主义的实践范例：内核是一个巨大的神经网络，工作时又会生成思想、计划、接口调用这些明确、可操作的符号（1.1.3）。

这三个维度对应三个具体的设计问题：要不要维护对话之外的内部状态；一步一看还是先整体规划；决策过程要不要留下可检查的中间产物〔待核验〕。本板块把它们分别落在[任务状态](node:taskstate)、[运行机制](node:mechanism)中的范式选择，以及[评输出与评轨迹](node:outputtrajectory)。

## 机制深挖

### 教材范式在时间维度上的位置

教材没有把第 4 章的三种范式与 1.1.3 的分类维度对应起来，下表的归类由本板块整理〔待核验〕：

| 范式 | 在时间维度上的位置 | 依据 |
|---|---|---|
| ReAct | 偏反应：“走一步，看一步”，用每一步的观察调整下一步 | 4.2.4 |
| Plan-and-Solve | 偏规划：先生成完整计划，再由执行器逐步完成 | 4.3 |
| Reflection | 在产出之后追加审议：执行—反思—优化 | 4.4 |

### 分类是谱系，不是互斥标签

教材把学习能力称为“可赋予上述所有类型的元能力”（1.1.3），这说明这些类别并不互斥。同一个大语言模型智能体，在不同任务上既可以偏反应也可以偏规划，取决于框架采用哪种范式、提示词如何约定，而不取决于模型本身。换框架会改变它在时间维度上的位置，这一点见[模型与框架的职责边界](node:responsibility)。

### 亚符号的局限在智能体里没有消失

教材在描述亚符号系统时列出的两个弱点——不透明、会产生看似合理却事实错误的幻觉（1.1.3）——正是大语言模型作为决策核心时要处理的问题。智能体生成的思想、计划与调用是可检查的符号，但产生它们的过程仍然不透明，见[大语言模型作为决策核心](node:llmcore)。

## 实验与原文

本节未运行实验。三个分类维度的完整论述见教材 1.1.3。

## 与相邻知识点的关系

- 三种范式的具体实现见[运行机制](node:mechanism)。
- 三个流派如何在历史上依次出现，见[从符号主义到大模型驱动](node:history)。
- 神经网络内核带来的能力与局限，见[大语言模型作为决策核心](node:llmcore)。

## 来源与核验

| 结论 | 依据位置 | 级别 |

| 反应式与规划式的取舍；混合式的分层做法 | 1.1.3 | 教材正文 |
| 大语言模型智能体是混合式的新形态，也是神经符号主义的实践范例 | 1.1.3 | 教材正文 |
| 三个维度对应的三个设计问题 | 由 1.1.3 的分界推导 | 待核验 |
| 三种范式在时间维度上的位置 | 4.2.4、4.3、4.4 的范式描述，归类由本板块整理 | 待核验 |

# 从符号主义到大模型驱动

## 定位

本节回答：智能体的构建方式经历了哪几次范式转变，每一次解决了上一代的什么问题，又留下了什么问题。这条线索解释了今天的智能体为什么是“模型 + 循环 + 工具”这种形态。

前置：[智能体的定义与构成](node:agentdef)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

教材把发展史组织成三大思潮的交织与融合：符号主义认为智能的核心是符号操作与逻辑推理；联结主义从模拟神经网络出发，让知识通过学习获得；行为主义强调在与环境的互动和试错中学习策略，其现代形态是强化学习（2.4.5）。大语言模型出现之后，这三条线的成果被整合进同一个循环。

按“解决了什么、留下了什么”把这条线索串起来：

| 阶段 | 代表成果 | 解决了什么 | 留下了什么问题 |
|---|---|---|---|
| 符号主义 | 物理符号系统假说；专家系统（知识库＋推理机）；SHRDLU | 把智能表述为可工程实现的符号计算；SHRDLU 首次把语言理解、规划、记忆集成进一个系统，形成“感知—思考—行动”闭环 | 知识获取瓶颈、常识问题、框架问题、系统脆弱性（2.1.4） |
| 心智社会 | 明斯基的理论 | 提出智能不来自单一完美原理，而是由大量简单、专门的过程协作涌现 | 为分布式与多智能体系统提供了概念基础，但实现路径不明确（2.3） |
| 联结主义 | 神经网络、深度学习 | 知识以连接权重分布式存储，通过学习自动获得；赋予智能体感知与模式识别能力 | 主要解决“看到了什么”，不解决“该做什么”（2.4.1、2.4.2） |
| 行为主义 | 强化学习、AlphaGo | 通过与环境交互试错，学习序贯决策策略，最大化累积回报 | 需要海量交互数据，学习之初缺乏先验知识与常识（2.4.3） |
| 预训练与大模型 | 预训练＋微调；涌现能力 | 用互联网级语料把世界知识压缩进权重，以全新方式回应知识获取瓶颈；涌现出上下文学习与思维链推理 | 知识是训练数据的快照，且会产生幻觉（3.3.2） |

把这张表读成一句话：符号主义解决“怎么推理”，联结主义解决“怎么感知与学习”，行为主义解决“怎么在交互中决策”，预训练解决“通用知识从哪来”；今天的智能体把它们放进同一个循环——模型负责决策，工具负责行动，外部记录负责状态〔待核验，归纳由本板块整理〕。

这条线索对工程的用处在于：符号主义遇到的两类根本问题并没有消失，只是换了形式出现〔待核验〕。

- **知识获取瓶颈**变成了上下文与检索问题。知识不再需要手工编码成规则，但“这一轮该把哪些知识放进模型输入”仍然要由工程解决，这是[信息：上下文、记忆与检索](node:information)整个部分的来由。
- **系统脆弱性**转移到了框架的约定上。规则不再写在知识库里，而是写在输出格式、解析逻辑与终止条件里；模型一旦偏离约定，系统同样会失灵，典型表现见[终止判定的漏判](node:terminate)。

## 机制深挖

### 符号主义为什么在开放世界失效

教材把原因归结为两类（2.1.4）。第一类是知识层面：专家系统的知识要靠专家与知识工程师访谈、提炼、编码，成本高且难以规模化，而许多内隐的、直觉性的知识很难表达为“IF-THEN”规则；常识则更难穷举，Cyc 项目历经数十年成果仍然有限。第二类是逻辑与工程层面：框架问题指执行一个动作后，如何高效判断哪些事物没有改变，显式声明所有不变状态在计算上不可行；系统脆弱性指规则之外的任何新情况都可能让系统完全失灵。教材特别指出，SHRDLU 的成功正是因为它运行在一个规则完备的封闭世界里。

### 心智社会中的“智能体”是另一个概念

明斯基理论中的智能体指一个极其简单、专门化、自身“无心”的心智过程，例如只负责识别线条或只负责抓握；若干智能体组成“机构”，复杂而有目的的行为从大量局部交互中涌现，没有任何一个部分掌握全局规划（2.3.2）。教材专门提示，这与第 1 章讨论的现代智能体不是同一个概念。

这一理论启发了去中心化控制、涌现式计算与智能体社会性的研究，是多智能体系统的概念源头（2.3.3）；相关内容见[构建：框架与多智能体](node:build)。

### 预训练如何回应知识获取瓶颈

预训练把“人工编码知识”换成了“在海量文本上自监督学习”：模型在数万亿级文本上预训练后，权重实际构成了一个关于世界知识的、高度压缩的隐式模型（2.4.3）。代价是这份知识不可直接检查、也不可直接编辑，并且停留在训练数据收集的时点。教材随后给出的补救手段——检索、多步验证、外部工具（3.3.2）——正是智能体结构的组成部分〔待核验〕。

## 实验与原文

教材 2.2 节用 ELIZA 的模式匹配与文本替换复现了一个基于规则的聊天机器人，可以直观感受规则系统的能力与边界。本节未运行该示例。

<script type="text/markdown" data-node="llmcore">
# 大语言模型作为决策核心

## 定位

本节回答：大语言模型为智能体提供了哪些能力、这些能力从哪里来，又带来哪些局限，以及选型时需要看哪些维度。模型内部的架构（Transformer、注意力机制等，教材 3.1）属于模型本身的知识，本节不展开。

前置：[智能体的定义与构成](node:agentdef)。文中的“框架”指模型之外、驱动循环运行的那层程序，见[模型与框架的职责边界](node:responsibility)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

**能力从哪里来。** 教材给出三条（3.2.1、3.3.1）：

- **缩放法则**：模型性能与参数量、训练数据量、计算量之间存在可预测的幂律关系；Chinchilla 定律进一步指出，在给定计算预算下，参数量与数据量存在最优配比，模型可以更小但需要多得多的数据。
- **能力涌现**：当规模跨过某个阈值，模型会展现出小规模模型不具备的能力——链式思考、指令遵循、多步推理、代码生成。教材由此给出一条对智能体开发者的直接结论：选择一个足够规模的模型，是实现复杂自主决策和规划能力的前提。
- **指令调优**：早期模型主要做文本补全，需要用少样本示例“教会”它做什么；经过指令调优的模型能够理解并遵循指令，直接下达清晰的自然语言指令才成为可能。

对智能体来说，模型承担的是三件事：把目标分解成步骤（规划）、在给定的工具描述下选出下一步调用（决策）、把返回的观察整合进下一步推理（理解）〔待核验，归纳由本板块整理〕。三件事都发生在“给定输入之后”，因此模型能做到什么，取决于框架给了它什么输入。

**两个必须知道的约束。**

- **词元与上下文窗口**：文本先由分词器切成词元（3.2.2），模型一次能处理的词元数有上限。教材把上下文窗口单列为选型维度，并指出需要理解长文档、分析代码库或维持长期记忆的智能体，需要较大的上下文窗口（3.2.4）。[工具结果处理](node:toolresult)与上下文工程的全部取舍，都来自这个上限。
- **采样参数**：温度控制输出的随机性，温度越低输出越确定、重复率越高，温度越高越发散；Top-k 与 Top-p 则限制候选词元的集合（3.2.1）。教材在调试 ReAct 智能体时建议把温度设为 0 以保证输出的确定性（4.2.4）。同一输入可能得到不同输出，这是[任务评估](node:taskeval)必须重复运行的直接原因。

**局限。** 教材列出三类（3.3.2）：

| 局限 | 教材的说明 | 在智能体里的表现 |
|---|---|---|
| 幻觉 | 分为事实性、忠实性与内在幻觉；成因包括训练数据含错误信息、自回归生成没有内置事实核查、复杂推理中逻辑出错 | 教材举例：旅游规划智能体可能推荐现实中不存在的景点，或给出航班号错误的机票 |
| 知识时效性不足 | 模型掌握的知识截止于训练数据收集的时点 | 新事件、新概念需要通过检索或工具获取 |
| 偏见 | 训练数据中的偏见与刻板印象会被模型吸收并反映出来 | 面向公众或涉及敏感信息的应用需要在选型时评估 |

教材把缓解手段分成三层：数据层面（清洗、引入事实性知识、基于人类反馈的强化学习）、模型层面（新架构、让模型表达不确定性）、推理与生成层面（检索增强生成、多步推理与验证、引入外部工具）（3.3.2）。第三层的三条，恰好就是智能体的三个基本构件——检索、反思、工具调用。换句话说，智能体这套结构本身，很大程度上就是对模型局限的工程回应〔待核验〕。

**选型维度**（3.2.4）：性能与能力、成本、速度（延迟）、上下文窗口、部署方式、生态与工具链、可微调性、安全性与伦理。教材同时提醒，模型版本与性能数据变化很快，选型原则比具体型号更重要。

## 机制深挖

### 模型差异如何传导到智能体

教材有两处可观察的例子。其一，使用自定义工具调用格式的 SimpleAgent，在复杂场景下的表现可能不如使用原生函数调用的智能体（12.2.6）。其二，并非所有模型都能持续稳定地遵循预设格式，提示词模板中的微小变动都可能影响模型行为（4.2.4）。

因此“换一个更强的模型”与“改一处框架实现”是两类不同的改动，各自改变什么、不改变什么，见[模型与框架的职责边界](node:responsibility)。

### 涌现能力与提示方式的对应

上下文学习让模型无需调整权重，仅靠输入中的零个或几个示例就能完成新任务；思维链让模型在回答复杂问题前先输出推理过程，可显著提升逻辑、算术与常识推理的准确性（2.4.3、3.3.1）。

ReAct 这类范式正建立在这两项能力之上：它要求模型每一轮先写出 `Thought` 再给出 `Action`（4.2），这既是思维链的应用，也让框架得以从输出中解析出结构〔待核验，这一因果关系由本板块整理〕。

### 温度设置的两难

调试时把温度设为 0 能让问题可复现（4.2.4），但生产环境未必使用同样的设置；用温度 0 调好的提示词，在实际采样参数下不一定同样稳定〔待核验〕。这也是评估要覆盖真实设置的原因，见[评估设计四要素](node:evaldesign)。

## 实验与原文

教材 3.2.3 给出了在本地部署并运行开源模型的完整步骤，第 3 章习题 4 要求调整采样参数、对比零样本与少样本等提示策略的效果差异。这是本板块后续可直接复现的实验入口之一，本节未运行。

# 运行机制：循环、范式与停止

本部分回答：智能体如何一步步推进任务，推理与行动有哪些组织方式，以及任务如何正确地结束。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 知识点

| 知识点 | 回答的问题 | 教材依据 | 状态 |
|---|---|---|---|
| 智能体循环 | 每一轮中感知、思考、行动各做什么，结果如何进入下一轮 | 1.2.2、4.2.1 | 读者前提 |
| ReAct：边推理边行动 | 为什么让推理与行动交替进行，这种方式的优势与局限是什么 | 4.2 | 未展开 |
| Plan-and-Solve：先规划后执行 | 什么情况下先整体规划、再逐步执行更合适 | 4.3 | 未展开 |
| Reflection：执行后反思修正 | 如何让智能体检查并改进自己的结果，代价是什么 | 4.4 | 未展开 |
| [停止条件设计](node:stopcond) | 任务何时算完成、何时必须停止，如何发现已经没有进展 | 第 4 章引言、4.2.3、4.2.4、4.4、7.4、9.5.1；Extra09 | 已发布 |
| [终止判定的漏判](node:terminate) | 循环为什么会把没完成的任务判为完成，或把原地打转当作正常推进 | 1.3.3、4.2.3、4.2.4、7.4.1、7.4.2、7.4.5 | 已发布 |

## 主线

智能体循环是智能体的基本运行单位。ReAct、Plan-and-Solve、Reflection 是在循环之上组织推理与行动的三种典型方式：ReAct “走一步，看一步”，根据每一步的观察调整下一步（4.2.4）；Plan-and-Solve 先生成完整计划，再由执行器逐步完成（4.3）；Reflection 在得到结果后进行审查与迭代优化（4.4）。

无论采用哪种范式，循环都必须能正确地结束。教材把步数上限称为防止智能体陷入无限循环的“安全阀”（4.2.3），但步数上限只是兜底。[停止条件设计](node:stopcond)回答“应当在什么条件下停”，[终止判定的漏判](node:terminate)回答“实际运行中为什么会停错”，两者是同一个问题的设计面与失效面。

## 与其他部分的关系

- 每一轮观察到的内容来自工具结果，见[行动：工具与协议](node:action)。
- 长任务中进度如何延续、中断后如何判断做到了哪一步，见[任务状态](node:taskstate)。
- 停止条件与终止判定是否可靠，需要用[任务评估](node:taskeval)来检验。

<script type="text/markdown" data-node="stopcond">
# 停止条件设计

## 定位

本节回答：一个多步任务应当在什么条件下结束，结束时又如何说明结束的原因。它是运行机制中“循环如何收尾”的设计面；与之配对的失效面——循环为什么会停错——见[终止判定的漏判](node:terminate)。

前置：智能体循环的基本结构（1.2.2、4.2），本节不再展开。文中的“框架”指模型之外、驱动循环运行的那层程序，见[模型与框架的职责边界](node:responsibility)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

教材中的每个智能体实现都设置了步数或迭代上限：第 1 章的示例循环最多 5 轮（1.3.3），ReActAgent 默认最多 5 步（4.2.3、7.4.2），ReflectionAgent 默认最多 3 轮迭代（4.4.3）。教材把这个上限称为防止智能体陷入无限循环的“安全阀”（4.2.3）。安全阀是必要的，但它只回答了“最多走几步”，没有回答任务是否已经完成、是否还值得继续。

停止条件实际上要回答三个不同的问题：

| 问题 | 对应条件 | 失守时的表现 |
|---|---|---|
| 做完了吗 | 成功判据 | 没完成就结束，或已经完成仍在继续 |
| 还能继续吗 | 资源预算、失败预算 | 成本失控，或在坏掉的工具上反复消耗 |
| 还在推进吗 | 无进展检测 | 每一轮都在“做事”，任务却停在原地 |

**成功判据**决定“完成”由谁认定。教材的实现大多由模型自己宣布完成：ReAct 要求模型只在确信信息足够时才输出 `Finish`（7.4.2），Reflection 在反馈文本中出现“无需改进”时停止（4.4.3）。自我宣布的完成既依赖模型的判断，也依赖框架能否正确识别这个信号；教材在习题中直接追问这类终止条件是否合理、能否设计得更智能（第 4 章习题 5）。当任务结果可以由程序检查（例如格式校验、测试是否通过）时，把检查放在框架侧，比只依赖模型自述更可靠〔待核验〕。

**资源预算**限制一次任务可以消耗多少。步数只是成本的近似：教材指出 ReAct 的每一步都伴随一次模型调用的延迟与费用（4.2.4），Reflection 每一轮至少多出两次调用（4.4.5）；而不同步骤的开销差别很大，一次返回大量内容的工具调用，会让之后每一轮的输入都变长。因此步数上限之外，通常还需要 token（或费用）上限与时间上限〔待核验〕。教材中的时间限制出现在单条命令层面：TerminalTool 为每条命令设置超时，示例中配置为 30 秒（9.5.1）。

**失败预算**限制可以容忍多少次失败。教材第 4 章引言把“工具调用失败的重试”列为框架需要处理的问题，习题也要求设计智能体多次调用错误工具或参数时的纠正机制（第 4 章习题 3）。社区补充章节给出了两种落点不同的做法：在提示词中规定“连续 3 次失败即停止并报告”，以及在工具注册层对连续失败 3 次的工具临时熔断（Extra09 第三、四章）。前者需要模型遵守，后者由程序强制执行。

**无进展检测**识别“看起来在运行，实际没有推进”。教材把 ReAct 可能“原地打转”列为固有局限（4.2.4），但没有给出检测方法。常见的检测信号包括：连续以相同参数调用同一个工具，连续多轮观察结果没有新增信息，任务状态（如计划中的当前步骤）长时间不前进〔待核验〕。

最后，停下来时必须说明是哪一种停止。“完成”“预算耗尽”“失败过多”“没有进展”对调用方意味着完全不同的后续处理；如果这些原因被合并成同一种返回，评估时就无法区分智能体是成功了、放弃了还是被强制中断〔待核验〕。

## 机制深挖

### 教材实现中的停止原因

对照教材代码，可以看到停止原因经常被混在一起（教材代码分析）：

| 实现 | 停止条件 | 结束时的返回 | 能否区分原因 |
|---|---|---|---|
| ReActAgent（4.2.3） | `Finish`；模型无响应或解析失败时退出循环；步数上限 | 按教材给出的片段位置拼合，提前退出循环后同样会打印“已达到最大步数”并返回空值 | 解析失败与步数耗尽无法区分 |
| ReActAgent（7.4.2） | `Finish`；步数上限 | 步数耗尽时返回一句固定的致歉文字 | 调用方拿到的是与正常答案同类型的字符串 |
| SimpleAgent 工具循环（7.4.1） | 这一轮没有工具调用；迭代上限 | 超过上限后再调用一次模型，把这次输出作为最终回答 | 无法得知回答是否在预算内完成 |
| ReflectionAgent（4.4.3） | 反馈含“无需改进”；迭代上限 | 返回最后一版结果 | 无法区分“已收敛”与“轮数用完” |

这些实现服务于教学，简化是合理的；但在需要评估与排查的场景中，停止原因应当作为结构化结果返回，而不是只打印到控制台〔待核验〕。

### 子串匹配判据的脆弱性

ReflectionAgent 用子串匹配判断是否停止：只要反馈文本中出现“无需改进”四个字就结束（4.4.3）。一段写着“这一部分无需改进，但边界处理仍有问题”的反馈，同样会触发停止（教材代码分析）。成功判据一旦依赖模型的自由文本，就同时依赖了模型的措辞与框架的匹配方式。教材习题给出的改进方向，是让模型对结果打出质量评分，只有低于阈值才继续优化（第 7 章习题），即把判据从自由文本改为结构化信号。

### 失败重试与终止信号是同一个问题

如果循环只根据“这一轮有没有工具调用”决定是否继续，那么一个在失败工具上反复重试的模型，每一轮都有工具调用，循环就会一直进行到步数上限。社区补充章节记录的两个案例都是这种形态：管道命令吞掉了错误，模型连续三轮换关键词重试一个其实路径有误的搜索（Extra09 第二章）；文件编辑返回冲突后，模型用相同参数反复重试，直到达到最大重试次数（Extra09 第六章）。失败预算与无进展检测解决的是“继续的理由是否成立”，而[终止判定的漏判](node:terminate)解释的是“循环为什么会把这些轮次当作正常推进”。

### 规则的落点

同一条停止规则，可以写在提示词里由模型遵守，也可以写在框架里由程序强制执行（如上面的失败计数与熔断）。两种落点的区别、以及哪些规则必须由程序强制执行，见[模型与框架的职责边界](node:responsibility)。

## 实验与原文

- 暂无配套实验。
- 原文位置：第 4 章引言、4.2.3、4.2.4、4.4.3、4.4.5、第 4 章习题 3 与 5；7.4.1、7.4.2、第 7 章习题；9.5.1。社区补充：Extra09 第二至六章。

# 终止判定的漏判

## 定位

本节回答：智能体循环每一轮结束时都要判断“结束还是继续”，这个判断为什么会出错，教材中的不同实现又分别会在哪里出错。停止条件应当如何设计，见[停止条件设计](node:stopcond)；本节只讨论判定本身的失效。

前置：智能体循环的基本结构（1.2.2、4.2）与工具调用的基本机制（4.2.2、7.5），本节不再展开。文中的“框架”指模型之外、驱动循环运行的那层程序，见[模型与框架的职责边界](node:responsibility)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

循环无法直接观察“任务是否完成”。它能观察到的只是模型这一轮输出的形态：有没有可识别的工具调用，有没有约定的完成标记（如 `Finish[...]`）。框架用输出形态来推断任务状态，本质上是在使用一个**代理信号**。

代理信号与真实状态之间会出现两个方向的偏差：

- **假完成**：输出形态像是结束了，任务其实没有完成。
- **假进行**：输出形态像是在推进，任务其实停在原地。

常见的三种漏判分别落在这两个方向上：

| 漏判 | 发生了什么 | 被误判为 |
|---|---|---|
| 格式出错被当作完成 | 模型想调用工具，但调用格式写错，解析器识别不出调用，这一轮就被归入“没有调用” | 假完成 |
| 中途纯文本被当作完成 | 模型还需要继续行动，却只输出了一段说明（例如“接下来我去查询天气”），没有发起调用 | 假完成 |
| 有调用但没有进展 | 每一轮都有工具调用，但反复失败或重复同样的调用，任务没有向前推进 | 假进行 |

前两种漏判出现在“没有工具调用就是最终回答”的判定规则下：这条规则把“模型不再调用工具”等同于“任务完成”，而格式错误和中途说明都会让调用消失。第三种漏判出现在“有工具调用就继续”的判定规则下：这条规则只看模型是否在行动，不看行动是否产生了结果。

教材中的四处实现，恰好展示了对“解析不出行动”这一情况的四种处理（教材代码分析）：

| 实现 | 解析不出行动时 | 后果 |
|---|---|---|
| 第 1 章示例循环（1.3.3） | 把格式错误作为观察结果回传给模型，进入下一轮 | 模型能看到错误并修正，但会消耗轮数 |
| ReActAgent（4.2.3） | 打印警告后退出循环 | 任务以失败结束，但结束提示与步数耗尽相同 |
| ReActAgent（7.4.2） | 不写入历史，直接进入下一轮 | 下一轮的提示词与本轮完全相同，可能重复同样的错误直到步数耗尽：假进行 |
| SimpleAgent 工具循环（7.4.1） | 找不到调用标记，把整段输出作为最终回答 | 假完成 |

从这张表可以得到两个判断。

第一，**解析失败是第三种状态**。它既不是“调用”，也不是“回答”；把它并入任何一侧，都会制造一种漏判。第 1 章的做法把它作为独立状态处理，是四种处理中唯一让模型看到错误、有机会自行修正的做法（教材代码分析）。

第二，**完成信号应当显式且独立**。使用 `Finish[...]` 这类显式标记的实现，不会因为模型漏掉了一次调用就直接结束；只以“没有调用”作为完成信号的实现，格式错误与中途说明都会变成最终回答。

教材指出，原生函数调用比依靠提示词约定格式更鲁棒（7.4.5）。原生函数调用由接口返回结构化的调用信息，可以减少“格式出错被当作完成”；但如果仍以“这一轮没有调用”来判定完成，“中途纯文本被当作完成”并不会因为换了调用协议而消失，“有调用但没有进展”也同样存在〔待核验〕。

## 机制深挖

### 格式错误有两层

以第 1 章的示例循环为例（1.3.3），格式错误实际上分为两层（教材代码分析）：

1. **找不到行动字段**：输出里没有 `Action:`。示例代码对这一层做了处理，回传错误提示并继续。
2. **行动字段的内容不合格式**：有 `Action:`，但工具名后缺少括号，或 `Finish` 后缺少方括号。示例代码在这一层直接对正则匹配的结果取值，匹配失败时会抛出异常，循环异常中断。

第 4 章的 ReActAgent 同样用正则表达式提取 `Finish[...]` 中的答案（4.2.3）。可见“能否识别完成信号”本身也是一次解析，完成信号写错时同样需要单独处理。教材在习题中也要求分析正则解析的脆弱性，并尝试更可靠的输出格式（第 4 章习题 2）。

### 迭代上限处的额外调用

SimpleAgent 的工具循环在达到迭代上限、仍未得到最终回答时，会再调用一次模型，并把这次的输出直接作为最终回答（7.4.1）。这次输出没有经过任何判定：如果模型仍在尝试调用工具，调用标记会作为回答文本返回（教材代码分析）。预算耗尽本应是一种明确的停止原因，这里被包装成了一次“正常回答”，属于假完成的变体。

同一实现在回填工具结果时，会附加一句“请基于这些结果给出完整的回答”（7.4.1）。这句由框架加入的话，可能促使模型在第一轮工具结果之后就直接作答，使需要多步调用的任务更容易提前结束〔待核验〕。

### 诊断依赖原始输出

漏判发生时，最终结果只显示“结束了”或“步数用完了”，看不出原因。教材的调试建议是：解析失败时打印模型返回的原始文本，以判断是模型没有遵循格式，还是解析逻辑有误（4.2.4）。两种原因的改进方向不同，分属[模型与框架的职责边界](node:responsibility)的两侧。要在批量评估中发现漏判，需要把每一轮的原始输出、解析结果和判定结论记录下来，见[评输出与评轨迹](node:outputtrajectory)。

## 实验与原文

- 暂无配套实验。
- 原文位置：1.3.3；4.2.3、4.2.4、第 4 章习题 2；7.4.1、7.4.2、7.4.5。

## 与相邻知识点的关系

- [停止条件设计](node:stopcond)：本节的设计面，负责成功判据、预算、失败预算与无进展检测。
- [工具结果处理](node:toolresult)：结果不可区分时（例如错误被吞掉、只剩空结果），容易诱发“有调用但没有进展”。
- [模型与框架的职责边界](node:responsibility)：解析方式与完成信号的定义属于框架侧。
- [评输出与评轨迹](node:outputtrajectory)：漏判通常只有在轨迹中才能被发现。

## 来源与核验

| 结论 | 依据位置 | 级别 |
|---|---|---|
| 教材要求模型用 `Finish[...]` 显式结束，并以步数上限兜底 | 1.3.3、4.2.3、7.4.2 | 教材正文 |
| 解析失败时应打印原始输出，区分模型未遵循格式与解析逻辑错误 | 4.2.4 | 教材正文 |
| 原生函数调用比提示词约束的格式更鲁棒 | 7.4.5 | 教材正文 |
| 四处实现对“解析不出行动”的四种处理及其后果 | 1.3.3、4.2.3、7.4.1、7.4.2 的示例代码 | 教材代码分析 |
| 格式错误分为“找不到字段”与“字段内容不合格式”两层，后者在示例中会引发异常 | 1.3.3、4.2.3 的示例代码 | 教材代码分析 |
| 迭代上限处的额外调用会把未经判定的输出作为最终回答 | 7.4.1 的示例代码 | 教材代码分析 |
| 以“没有调用”判定完成时，原生函数调用不能消除中途纯文本与无进展两类漏判；框架追加的作答提示会促使提前结束 | 基于判定规则与示例代码的推导，教材未讨论 | 待核验 |

# 行动：工具与协议

本部分回答：智能体靠什么作用于外部世界——工具如何被描述、调用并返回结果，跨系统、跨智能体时又如何标准化。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 知识点

| 知识点 | 回答的问题 | 教材依据 | 状态 |
|---|---|---|---|
| 工具调用的基本机制 | 模型如何表达要调用哪个工具、传入什么参数，由谁负责执行 | 4.2.2、7.5.1 | 读者前提 |
| 原生函数调用与提示词约束 | 用提示词约定调用格式与使用模型原生函数调用，可靠性差在哪里 | 7.4.1、7.4.5 | 未展开 |
| 工具设计与注册 | 工具的粒度、描述与注册方式如何影响模型能否用对 | 7.5；Extra09 | 未展开 |
| [工具结果处理](node:toolresult) | 工具返回的内容过大时，如何交还给模型而不淹没上下文 | 9.2.2、9.2.3、9.5.1、9.5.3；Extra09 | 已发布 |
| 通信协议：MCP、A2A、ANP | 工具接入、智能体之间协作、智能体发现分别需要什么样的协议 | 第 10 章 | 未展开 |
| Skills | 封装“如何使用工具完成某类任务”的知识，与工具和协议是什么关系 | Extra05、Extra08 | 未展开 |

## 主线

工具让智能体从只能生成文本，变为能够读取和改变外部状态。一次工具调用包含三个环节：模型给出调用声明，程序执行调用，结果返回给模型。前两个环节决定调用是否正确；第三个环节决定模型下一轮能否基于结果继续推理——结果过大、格式不清或错误信息缺失，都会让后续决策失去依据，这是[工具结果处理](node:toolresult)要解决的问题。

当工具数量增多、需要跨系统复用时，通信协议把接入方式标准化：MCP 负责工具与数据的接入，A2A 与 ANP 面向智能体之间的协作与发现（第 10 章）。Skills 解决的是另一个层面的问题：MCP 让智能体“够得着”工具，Skills 则把特定场景下如何组合使用这些工具的程序性知识封装起来，并按需分层加载（Extra05）。

## 与其他部分的关系

- 调用声明能否被正确识别，直接影响循环的终止判定，见[运行机制](node:mechanism)。
- 工具结果进入模型输入后占用上下文，与[信息：上下文、记忆与检索](node:information)相互制约。
- 模型决定调用、程序负责执行，这一分工在[模型与框架的职责边界](node:responsibility)中展开。

# 工具结果处理

## 定位

本节回答：工具返回的内容远超模型需要时，应当如何交还给模型；以及为什么这件事必须由框架负责，而不能留给工具或模型自己处理。

前置：工具调用的基本机制——模型给出调用声明，由程序执行（4.2.2、7.5）；上下文工程的基本概念（第 9 章、Extra02）。本节不再展开。文中的“框架”指模型之外、驱动循环运行的那层程序，见[模型与框架的职责边界](node:responsibility)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

工具产出的量与模型需要的量天然不对等。一次代码搜索可能命中几千行，一次文件读取可能返回整个文件，而模型当前只需要其中几行。更关键的是，工具结果一旦写入对话历史，之后每一轮都会重新作为输入；教材在长时程策略中把“清理深历史中的工具调用与结果”称为一种安全的轻触式压缩（9.2.3），说明这些结果默认会一直留在上下文里。

结果进入模型输入之前，需要决定三件事：给模型多少，剩下的内容放在哪里，模型需要时怎样再拿到。常见的五种做法可以沿两个维度比较：

| 做法 | 做什么 | 信息是否保留 | 由谁决定取什么 |
|---|---|---|---|
| 截断并告知 | 只返回一部分，并明确告诉模型内容已被截断 | 截掉的部分丢失 | 框架预先决定 |
| 分页或游标 | 返回一段，模型用页码、行范围或游标请求下一段 | 保留 | 模型按需请求 |
| 落盘引用 | 完整结果写入文件，只返回预览与文件位置 | 保留 | 模型按需读取 |
| 返回前二次处理 | 由程序或子智能体先筛选、聚合、摘要，只返回处理结果 | 细节丢失 | 框架或子智能体决定 |
| 上游契约治理 | 在工具接口上约定默认数量、过滤参数与返回状态，从源头限量 | 按约定保留 | 接口约定边界，模型通过参数选择 |

两个维度之间存在取舍：由框架预先决定，输入规模可控，但可能丢掉模型真正需要的部分；由模型按需获取，信息不会丢，但需要多一轮调用，并要求模型知道还有内容可取。无论选择哪一种，**截断都必须被告知**：教材在输出超限时附加“输出被截断”的提示（9.5.1），社区补充章节则用 `partial` 状态标记被截断的结果（Extra09 第五章）。反面教训同样来自社区补充章节：把搜索限制为前 10 条、读取限制为前 50 行这类粗暴截断，会把关键信息一并截掉，模型基于不完整的信息做决策，错得更离谱（Extra09 第五章）。

这件事归框架负责，是因为框架是唯一同时满足以下三个条件的位置〔待核验〕：

1. **位置**：工具结果从产生到进入模型输入，中间只经过框架。模型看不到还没有交给它的内容，也无法撤回已经进入上下文的内容。
2. **信息**：决定截多少，需要同时知道结果有多大、当前上下文还剩多少。工具不知道上下文预算，模型在看到结果之前不知道结果有多大；教材的 ContextBuilder 正是把 token 预算作为框架侧的职责来守护（9.3.1）。
3. **协议**：结果是否被截断、是空结果还是执行出错，需要统一的返回约定才能让模型区分，而这类约定只能由框架统一规定（Extra09 第三章）。

因此，大结果处理的能力边界由框架决定：同一个模型，在一个静默截断的框架里，和在一个“截断并告知、完整结果可回查”的框架里，拿到的证据不同，决策质量也会不同。这一点在[模型与框架的职责边界](node:responsibility)中展开。

## 机制深挖

### 教材中的做法

- **截断并告知**：TerminalTool 在输出超过配置的上限时截断，并附加“输出被截断”的提示（示例中上限配置为 10MB，9.5.1）。教材把它列为安全机制的第四层，目的是防止内存溢出。这一量级的文本远超常见模型的上下文窗口，所以这道限制是运行安全的兜底，不能替代面向上下文预算的结果处理（教材代码分析）。
- **由模型按范围请求**：教材提倡“及时上下文”，只维护文件路径、查询、URL 等轻量引用，运行时再用工具加载，并用 `head`、`tail` 等命令分析大体量数据（9.2.2）。TerminalTool 的使用示例展示了用 `head -n`、`wc -l`、`sed -n` 等命令只取行范围或统计结果（9.5.3）；示例中的命令由调用方发出，当同类命令改由智能体发出时，相当于由模型自己指定“分页”与“聚合”（教材代码分析）。
- **返回前二次处理**：子代理架构中，子智能体在自己的上下文窗口里完成大量搜索，只向主智能体回传凝练摘要，常见为 1,000–2,000 tokens（9.2.3）。

面向接口的分页游标设计，在本板块核对的教材章节中没有涉及；前表对它的描述属于通用做法〔待核验〕。

### 社区补充中的做法

Extra09 第五章给出了一套把截断、告知与落盘组合起来的规则：单次工具输出超过 2000 行或 50KB 时，只保留头尾各 40 行作为预览，完整输出写入文件，并以 `partial` 状态返回文件位置；模型需要时可以读取该文件，或在文件中进一步搜索。同一章还把用户提到的文件改为只插入“请先读取这些文件”的提醒，不再直接注入文件内容，把取用的决定交给模型。

Extra09 第二、三章说明了上游契约的价值：管道命令把上游错误吞掉后，模型只看到空结果，无法区分“确实没有”和“执行出错”，于是反复换关键词重试；改为原子工具并统一返回 `success`、`partial`、`error` 三种状态后，空结果、截断与错误可以被明确区分。

### 选择的依据

选择哪种做法，取决于模型之后是否可能需要被省略的部分〔待核验〕：

- 结果主要用于判断“有没有”“有多少”时，适合在工具侧聚合或摘要后返回；
- 结果可能成为后续修改或引用的证据时，适合落盘引用或分页，保证完整内容可以回查；
- 结果体量不可预期时（如开放式搜索），应在接口上设置默认上限与过滤参数，并在返回中标明是否还有更多内容。

## 实验与原文

- 暂无配套实验。
- 原文位置：9.2.2、9.2.3、9.3.1、9.5.1、9.5.3。社区补充：Extra09 第二、三、五章。

## 与相邻知识点的关系

- [终止判定的漏判](node:terminate)：错误与空结果不可区分时，模型会反复重试，形成“有调用但没有进展”。
- [任务状态](node:taskstate)：落盘的完整结果与进度记录一样，都位于上下文之外、需要时再取回。
- [模型与框架的职责边界](node:responsibility)：大结果处理由框架决定，更换框架即改变模型能拿到的证据。

## 来源与核验

| 结论 | 依据位置 | 级别 |

| 深历史中的工具调用与结果需要主动清理，属于轻触式压缩 | 9.2.3 | 教材正文 |
| 及时上下文：维护轻量引用，运行时按需加载，用 head、tail 等分析大体量数据 | 9.2.2 | 教材正文 |

| TerminalTool 超过 10MB 截断并提示，用于防止内存溢出 | 9.5.1 | 教材正文 |
| 10MB 限制远超上下文窗口，属于运行安全兜底；命令行范围读取相当于模型指定分页与聚合 | 9.5.1、9.5.3 的示例代码 | 教材代码分析 |
| 不告知的截断会让模型基于不完整信息决策；截断预览加落盘、以 partial 状态返回文件位置 | Extra09 第五章 | 社区补充 |

# 信息：上下文、记忆与检索

本部分回答：模型每一轮做决策时能看到什么，哪些信息需要跨轮次、跨任务保留，外部知识如何按需取回。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 知识点

| 知识点 | 回答的问题 | 教材依据 | 状态 |
|---|---|---|---|
| 上下文工程 | 如何在有限的上下文窗口中为每一轮挑选、组织与压缩信息 | 9.1–9.3；Extra02 | 读者前提 |
| [任务状态](node:taskstate) | 长任务的进度为什么不能只靠对话历史推断，只保存对话会带来哪些后果 | 4.3.3、9.2.3、9.4、9.6.1；Extra09 | 已发布 |
| 记忆系统 | 智能体需要哪几类记忆，记忆如何存储、检索与管理 | 8.1、8.2 | 未展开 |
| 检索增强生成（RAG） | 如何从外部知识库按需检索内容并提供给模型 | 8.3 | 未展开 |

## 主线

大语言模型本身不保留调用之间的信息，智能体在某一轮“知道什么”，完全取决于这一轮输入里放了什么。四个知识点分别处理不同时间尺度上的信息：上下文工程处理单次输入的取舍；[任务状态](node:taskstate)处理一次任务之内的进度延续；记忆系统处理跨任务的信息复用；检索增强生成处理外部知识的按需获取。

它们服务于同一个目标：让模型在每一轮拿到做出正确决策所需的信息，而不是全部信息。长时程任务中的压缩整合、结构化笔记与子代理架构（9.2.3），都是在上下文窗口有限这一约束下实现这个目标的做法。

## 与其他部分的关系

- 工具结果是上下文膨胀的主要来源之一，见[工具结果处理](node:toolresult)。
- 任务状态与停止条件共同决定长任务能否正确推进并结束，见[停止条件设计](node:stopcond)。
- 记忆与检索的质量需要单独评估，见[验证与提升](node:evaluation)。

# 任务状态

## 定位

本节回答：一个需要多步、甚至跨会话完成的任务，为什么不能只靠对话历史来判断“做到哪了”，只保存对话会带来哪些后果。

前置：上下文工程的基本概念与长时程策略（第 9 章、Extra02），本节不再展开。文中的“框架”指模型之外、驱动循环运行的那层程序，见[模型与框架的职责边界](node:responsibility)。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

对话历史记录的是**发生过什么**：用户说了什么、模型想了什么、调用了哪些工具、工具返回了什么。它不直接记录**做到哪了**：计划有哪几步、哪些已经完成、哪一步正在进行、哪些调用已经对外部产生了影响。如果只保存对话，每一轮开始时，“当前进度”都要由模型重新阅读历史推断出来。

**进度靠推断**是其他后果的根源。推断所依据的历史一旦不完整、被压缩或表述含糊，推断就会出错，并表现为三类后果〔待核验〕：

| 类别 | 表现 | 容易触发的情形 |
|---|---|---|
| 重复 | 已经完成的步骤被再次执行；如果该步骤有外部副作用且不是幂等的（例如发送消息、创建记录、发起支付），重复执行会造成真实损失 | 完成记录被压缩掉，或“是否已完成”在历史中表述含糊 |
| 遗漏 | 计划中的某一步被跳过；最初列出的任务清单随早期对话被截断或压缩而丢失 | 计划只存在于早期消息中 |
| 不可判定 | 调用已经发出，结果还没有写回历史时任务中断；恢复后无法判断这次调用是否已经生效 | 中断发生在调用与结果之间 |

这三类后果与上下文管理直接咬合。长时程任务必然要压缩或清理历史（9.2.3），而压缩恰恰会删掉推断进度所依据的细节。社区补充章节给出了两个观察：只保留最近若干条消息时，模型连用户最初的需求都会忘记；即使为旧历史生成了摘要，摘要也只说明“从哪来”，并不负责说明“现在在哪一步”（Extra09 第五章）。历史越长越需要压缩，压缩越多，靠历史推断进度就越不可靠。

教材给出的方向是把进度写到对话之外。结构化笔记被定义为以固定频率把关键信息写入上下文之外的持久化存储，例如维护 TODO 列表或 NOTES.md，使智能体在数十次工具调用与多轮上下文重置之后仍能保持进度与一致性（9.2.3）；NoteTool 专门提供了记录任务状态、阻塞点与下一步行动的笔记类型（9.4.1）。

任务状态与记忆的区别也在这里划清。教材指出，第 8 章的 MemoryTool 主要面向对话式记忆，而需要长期追踪、结构化管理的项目式任务，需要 NoteTool 这样的记录方式（9.4.1）。本板块据此约定：**任务状态**指一次任务之内的执行进度，服务于“接下来做什么”；**记忆**指跨任务复用的信息，例如偏好、事实与经验，见[上下文、记忆与检索](node:information)中的“记忆系统”。

## 机制深挖

### 两种范式对进度的保存方式

对照第 4 章的两个实现，可以看到进度是否结构化的差别（教材代码分析）：

- **ReAct（4.2.3）**：进度只存在于不断累积的“行动—观察”历史文本中。哪些信息已经拿到、还缺什么，每一轮都由模型读完整段历史自行判断。
- **Plan-and-Solve（4.3.3）**：计划是一个步骤列表，执行器按顺序遍历；“当前是第几步”由程序中的循环位置决定，不需要模型推断。

后者的进度是结构化的，因此不会出现“模型以为某一步已经做过”这类推断错误。但它的状态只保存在运行中的程序变量里，进程一旦中断，进度同样丢失；而且计划一次生成、执行中不可修改，教材在习题中把“动态重规划”列为需要进一步设计的问题（第 4 章习题 4）。

### “已调用未返回”的特殊性

重复与遗漏可以通过更好的记录来缓解，“不可判定”却不同：调用已经发往外部系统，结果却没有返回，框架此时并不知道外部世界是否已经改变。对只读工具，重新调用一次即可；对有副作用的工具，重新调用可能造成重复，不调用又可能遗漏〔待核验〕。本板块核对的教材章节与补充章节都没有讨论这一问题。

社区补充章节中有两项相关的做法：修改文件前必须先读取，提交修改时校验文件在读取之后是否被改动；把同一文件的多处修改作为一次原子操作提交，避免文件停在“改了一半”的状态（Extra09 第三章）。前者防止基于过期状态行动，后者避免中断留下半完成的结果。

### 进度与约束不应只存在于会被压缩的历史里

社区补充章节记录了一个案例：自动压缩上下文时，用户事先设定的“未经批准不得操作”被当作普通历史压缩掉，智能体随后执行了未经批准的删除操作（Extra09 第五章）。案例涉及的是约束而不是进度，但失效方式相同：凡是之后每一轮都必须成立的信息，都不应只作为对话历史的一部分存在。具体的压缩策略属于上下文工程，本节不展开。

## 实验与原文

- 暂无配套实验。
- 原文位置：4.2.3、4.3.3、第 4 章习题 4；9.2.3、9.4.1、9.4.5、9.6.1。社区补充：Extra09 第三、五章。

## 与相邻知识点的关系

- [停止条件设计](node:stopcond)：无进展检测需要可比较的进度记录。
- [工具结果处理](node:toolresult)：落盘的完整结果与进度记录一样，都位于上下文之外、需要时再取回。
- [上下文、记忆与检索](node:information)：上下文工程决定每轮输入包含什么；记忆系统处理跨任务的信息。
- [评输出与评轨迹](node:outputtrajectory)：重复执行与漏步在最终输出中不一定可见，需要检查轨迹。

## 来源与核验

| 结论 | 依据位置 | 级别 |
|---|---|---|
| 长时程任务需要压缩与清理历史；结构化笔记把关键信息写到上下文之外，跨多轮上下文重置保持进度 | 9.2.3 | 教材正文 |
| NoteTool 提供任务状态、阻塞点、行动等笔记类型；MemoryTool 面向对话式记忆，项目式任务需要结构化记录 | 9.4.1、9.4.5 | 教材正文 |
| 跨会话的长程任务需要保持进度 | 9.6.1 | 教材正文 |
| Plan-and-Solve 的计划一次生成，动态重规划留作习题 | 4.3.3、第 4 章习题 4 | 教材正文 |
| ReAct 的进度只存在于历史文本；Plan-and-Solve 的当前步骤由程序循环决定，但只存在于内存 | 4.2.3、4.3.3 的示例代码 | 教材代码分析 |
| 只保留最近消息会丢失原始需求；摘要不负责说明当前位置；压缩导致关键指令丢失的案例 | Extra09 第五章 | 社区补充 |
| 读后才能改、提交时校验文件是否变化、多处修改原子提交 | Extra09 第三章 | 社区补充 |
| 只存对话的三类后果（重复与不幂等副作用、遗漏与清单丢失、已调用未返回不可判定）及其处理难点 | 基于对话历史与结构化进度差异的推导；教材与补充章节未系统讨论 | 待核验 |

# 构建：框架与多智能体

本部分回答：模型、工具、上下文与状态如何组织成一个可运行、可维护的系统；单个智能体不足以完成任务时，多个智能体如何分工协作。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 知识点

| 知识点 | 回答的问题 | 教材依据 | 状态 |
|---|---|---|---|
| 框架的核心抽象 | 一个智能体框架需要哪些基本组件：模型接口、消息、智能体基类、工具注册 | 7.1–7.3、7.5.1 | 未展开 |
| [模型与框架的职责边界](node:responsibility) | 哪些行为由模型决定、哪些由框架决定；更换模型与更换框架各自改变什么 | 第 4 章引言、4.2.4、7.1.2、7.4.5、12.2.6；Extra01 | 已发布 |
| 低代码平台 | Coze、Dify、FastGPT、n8n 这类平台适合什么场景，边界在哪里 | 第 5 章 | 未展开 |
| 主流开发框架 | AutoGen、AgentScope、CAMEL、LangGraph 的设计取向有何不同 | 第 6 章 | 未展开 |
| 多智能体协作 | 何时需要多个智能体，角色如何划分、协作如何组织 | 2.3、6.2–6.4、9.2.3、13.3 | 未展开 |

## 主线

手写一个循环就能跑通单个智能体，但工程问题会随任务复杂度迅速增加。教材在第 4 章引言中列举了框架替开发者处理的问题：模型输出格式的解析、工具调用失败的重试、防止智能体陷入死循环等。这些都是模型之外的运行逻辑，由框架承担（工程实践中也常把这层程序称为 harness）。因此，同一个模型在不同框架中的表现可能不同，例如教材 7.4.5 指出，原生函数调用比依靠提示词约束格式更鲁棒。弄清[模型与框架的职责边界](node:responsibility)，是判断问题出在哪一侧、改进应当落在哪一侧的前提。

在此基础上，低代码平台与主流开发框架提供了不同抽象层次的现成方案。现成框架在工程效率上有优势，也有过度抽象、接口频繁变动、内部逻辑不透明等代价（7.1.1）。当任务需要不同专长的角色分工或并行探索时，再进一步引入多智能体协作。

## 与其他部分的关系

- 框架负责组织的循环、工具与信息，分别见[运行机制](node:mechanism)、[行动：工具与协议](node:action)与[信息：上下文、记忆与检索](node:information)。
- 判断一次改动的效果出在模型侧还是框架侧，需要[任务评估](node:taskeval)的方法支撑。

# 模型与框架的职责边界

## 定位

本节回答：智能体的行为中，哪些由模型决定、哪些由框架决定；更换模型与更换框架时，分别有哪些行为会改变、哪些不会。本板块把模型之外、驱动智能体循环运行的程序统称为框架，工程实践中也常称为 harness，教材仓库的参考答案称之为“外部执行器”（Extra01）。

前置：工具调用的基本机制——模型给出调用声明，由程序执行（4.2.2、7.5），本节不再展开。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

在智能体循环的每一轮里，模型只做一件事：**在给定的输入下，决定下一步**——调用哪个工具、传入什么参数，或者给出什么回答。除此之外的事情都由框架完成：输入里放什么，声明如何被识别和执行，结果怎样回到下一轮输入，什么时候停下，留下什么记录。教材在第 4 章引言中列举的框架职责——解析模型输出格式、重试失败的工具调用、防止智能体陷入死循环——都属于后一类。

按循环中的环节，两侧的分工如下〔待核验〕：

| 环节 | 模型决定 | 框架决定 |
|---|---|---|
| 看到什么 | 如何理解给到的内容 | 系统提示词、工具描述、历史、笔记与检索结果如何装配进输入 |
| 能做什么 | 在可用工具中选择哪一个 | 提供哪些工具，工具如何描述 |
| 声明如何被识别 | 输出是否符合约定 | 采用提示词约定格式还是原生函数调用，解析失败如何处理 |
| 如何执行 | — | 执行、超时、权限与错误处理 |
| 结果如何回来 | 如何解读结果 | 截断、告知、落盘与返回状态 |
| 何时停止 | 是否给出完成信号 | 如何识别完成信号，预算与失败上限 |
| 留下什么 | — | 任务状态与运行轨迹的记录 |

据此可以回答“换一侧，变什么”：

- **更换模型**，改变的是同样输入下的决策质量：推理与规划能力、指令与格式遵循、工具选择与参数的准确性、模型自身的知识。**不变**的是模型能看到的信息、可用的动作、声明的识别方式、结果的回填方式与停止规则。因此，框架层面的缺陷不会因为换模型而被修复，只可能因为更强的模型更少触发它而被掩盖〔待核验〕。
- **更换框架**，改变的是模型所处的条件：输入由什么构成、可以采取哪些行动、调用如何被识别、结果如何回来、何时停下、中断后能否继续。**不变**的是模型面对同一份输入时的决策能力。因此，同一个模型换一个框架，表现可能明显不同。教材给出了直接的例证：原生函数调用比依靠提示词约束格式更鲁棒（7.4.5）；在 BFCL 评估中，使用自定义调用格式的 SimpleAgent 在复杂场景下的表现，可能不如使用原生函数调用的智能体（12.2.6）。

两侧并不独立。教材指出，并非所有模型都能持续稳定地遵循预设格式（4.2.4）；而框架如何处理格式偏差，决定了这种模型差异在结果上被放大还是被吸收——同样一次格式错误，在不同实现中可能被回传修正、被当作完成，或者引发原地重复（教材代码分析，见[终止判定的漏判](node:terminate)）。

这条边界也是[工具结果处理](node:toolresult)结论的延伸：模型只输出调用声明，大结果如何交还给模型由框架决定，所以更换框架就改变了模型所能拿到的证据，也就改变了智能体的能力边界。

## 机制深挖

### 教材改进手段的归属

教材在调试 ReAct 与提升 BFCL 分数时给出的建议，可以按两侧归类（建议出自教材正文；归入哪一侧由本板块判断〔待核验〕）：

| 建议 | 出处 | 所属一侧 |
|---|---|---|
| 更换能力更强的模型，或调整采样温度（temperature） | 4.2.4 | 模型 |
| 改用支持原生函数调用的模型 | 12.2.6 | 两侧都涉及：需要模型支持，也需要框架改用该协议 |
| 打印完整提示词，追溯决策依据 | 4.2.4 | 框架（提示词由框架拼装） |
| 验证工具的输入输出格式 | 4.2.4 | 框架（工具与结果回填） |
| 在提示词中加入示例 | 4.2.4 | 框架 |
| 扩展工具库，针对不同类别设计不同策略 | 12.2.6 | 框架 |

提示词归入框架一侧，是因为提示词模板由程序填入工具描述、问题与历史之后才交给模型（4.2.3）。但提示词的效果依赖具体模型：教材同时指出，模板中的微小变动都可能影响模型行为（4.2.4）。这意味着针对某个模型调好的提示词，换模型后需要重新验证〔待核验〕。

### 规则的两种落点：提示词与代码

同一条约束可以放在两侧。写在提示词里（例如“连续失败 3 次就停止”“不要用相同参数重复编辑”），它是否生效，取决于模型是否遵守、是否还记得；写在框架代码里（例如失败计数与熔断、执行危险操作前的强制确认），它不依赖模型的判断。社区补充章节的做法是：关键约束不放进会被压缩的对话历史，高风险操作的确认由代码硬性检查、不交给模型判断（Extra09 第五章）；工具连续失败时，由工具注册层熔断（Extra09 第三章）。把必须成立的约束从模型一侧移到框架一侧，是划分职责边界时的一种重要手段〔待核验〕。

### 更换模型的成本

HelloAgents 选择在 OpenAI 兼容接口之上构建，并支持多个模型提供商与自动检测（7.1.2、7.2）。在这种设计下，更换模型通常只需要改配置，调用方式不变（7.2.3）。这让“只换模型、框架不变”的对照很容易进行；反过来，更换框架往往意味着提示词、工具协议与循环逻辑多处同时改变，对照时更需要控制变量，见[评估设计四要素](node:evaldesign)。

## 实验与原文

- 暂无配套实验。
- 原文位置：第 4 章引言、4.2.3、4.2.4；7.1.2、7.2.3、7.4.5；12.2.6。补充章节：Extra01（术语）、Extra09 第三、五章。

## 与相邻知识点的关系

- [终止判定的漏判](node:terminate)：解析方式与完成信号属于框架侧，漏判是框架侧缺陷的典型表现。
- [工具结果处理](node:toolresult)：大结果处理归框架，是“更换框架即改变能力边界”的直接来源。
- [停止条件设计](node:stopcond)：停止规则由模型遵守，还是由框架强制。
- [任务评估](node:taskeval)：改模型与改框架应当分开评估，才能判断改进来自哪一侧。

# 验证与提升：评估与训练

本部分回答：如何判断一个智能体、或者一次改动，是变好还是变坏；在评估的基础上，有哪些途径让智能体持续变好。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

| [任务评估](node:taskeval) | 如何可靠地比较两个版本：固定任务集、基线、事先确定标准、多次运行；评输出与评轨迹；失败集与回归 | 第 12 章；Extra02、Extra09 | 已发布 |
| 公开基准 | BFCL、GAIA 等基准分别衡量什么能力，结果应当如何解读 | 12.1.2、12.2、12.3 | 未展开 |
| 可观测性与轨迹记录 | 如何记录模型每一轮实际收到了什么、做了什么，用来定位问题 | Extra09 | 未展开 |
| Agentic RL | 如何通过监督微调与强化学习提升模型作为智能体的能力 | 第 11 章 | 未展开 |
| 自进化 | 智能体如何把运行中积累的经验沉淀下来，反哺后续任务 | Extra10 | 未展开 |

## 主线

教材指出，智能体评估面临输出不确定、评估标准多样与评估成本高昂三个挑战（12.1.1）；加上任务往往要走多步、还可能产生外部副作用，“跑通一次”并不能说明它可靠。评估回答“变好还是变坏”：公开基准衡量通用能力，[任务评估](node:taskeval)衡量针对自身任务的改动效果，可观测性则提供定位失败原因所需的轨迹。教材第 12 章以 BFCL、GAIA 与数据生成质量评估三个场景搭建了评估体系（12.1.3）。

提升可以发生在模型之外，也可以发生在模型本身。前者通过改进提示、工具与上下文，或者把经验沉淀为可复用的技能来实现（Extra10）；后者通过监督微调与强化学习直接训练模型（第 11 章）。无论走哪条路径，都需要评估来确认改进确实发生。

# 任务评估

## 定位

本节回答：怎样可靠地判断一个智能体——或者对它的一次改动——在自己的任务上变好还是变坏。教材在第 12 章开篇提出的正是这个问题：优化提示词或更换模型之后，如何知道是否真的有改进（12.1.1）。

任务评估与公开基准（见[评估与训练](node:evaluation)）的目标不同。公开基准在统一的数据集与评分方法下衡量通用能力，便于横向比较不同系统；任务评估面向自己的任务与自己的改动，回答“这次改动是否值得保留”。两者的方法大量重合：教材中的 BFCL、GAIA 与数据生成质量评估，为任务评估提供了可以直接借用的数据组织方式与判定方法。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

### 单次运行的结论不可靠

教材把智能体评估的独特挑战概括为三点：输出不确定，同一问题可能有多个正确答案；评估标准多样，不同任务需要不同的判定方法；评估成本高，每次评估都需要大量模型调用（12.1.1）。此外，智能体要走多步，每一步的采样结果与工具返回都可能不同，同一个任务两次运行可能走出不同的路径〔待核验〕。一次成功或失败，既可能来自改动本身，也可能只是这一次运行的偶然结果。

### 可靠比较的四个要素

要让“改动前后”的比较有意义，评估需要同时满足四个条件：

1. **固定任务集**：改动前后使用同一批任务。任务应覆盖不同类型，并包含“不应该行动”的反例；BFCL 就专门设置了判断是否需要调用函数的类别（12.2.1）。
2. **基线**：与改动前的版本在相同任务集、相同设置下比较。教材的对比评估示例，正是在同一类别、同样样本数上比较默认提示词与优化提示词两种配置（12.2.6）。
3. **事先确定标准**：在看到结果之前定好判定规则。教材展示了三类自动判定方法——规则匹配（BFCL 的抽象语法树匹配、GAIA 的准精确匹配）、评分量表（以模型作为评审，即 LLM Judge）与成对比较（胜率，Win Rate），以及作为补充的人工验证（12.2.1、12.3.1、12.4.1）。
4. **多次运行**：同一任务重复运行多次，用通过率与波动而不是单次结果做比较〔待核验〕。教材没有讨论重复运行，只在调试建议中提到把采样温度设为 0 以保证输出的确定性（4.2.4）。

### 输出与轨迹

**评输出**看最终结果是否正确；**评轨迹**看过程：调用了哪些工具、参数是否正确、顺序与次数是否合理、消耗了多少 token 与时间、是否产生了不必要的副作用。教材中两种视角都有：BFCL 判定的是单次调用决策是否正确（12.2.1），GAIA 判定最终答案并统计平均推理步骤数（12.3.1），效率指标包括 token 用量与响应时间（12.1.2），习题还要求把评估扩展到调用顺序与调用次数（第 12 章习题 2）。

两者缺一不可：输出正确不代表过程可以接受，它可能靠运气、绕了远路或产生了多余的副作用；输出错误时，只有轨迹能指出从哪一步开始偏离。[终止判定的漏判](node:terminate)这类问题，也只有在轨迹中才能看清。

### 失败集与回归

每次评估或实际使用中发现的失败，都应整理进**失败集**，并补充到固定任务集中。之后的每次改动，都在包含这些失败案例的任务集上重新运行，逐个任务与基线对比，找出“原来通过、现在失败”的**回归**〔待核验〕。教材的实践建议要求分析失败案例、找出薄弱环节（12.2.6），习题进一步提出设计定期运行、性能下降时告警的持续评估系统（第 12 章习题 5）。

### 一次只改一处

改动应当一次只改一个变量，并把“改模型”与“改框架”分开评估；否则即使结果变好，也无法知道是哪一处改动起了作用。社区补充章节的做法是：保持其他条件不变，只改提示词中的一点，在同样的测试用例上记录成功率、步数与 token 消耗，再对比新旧轨迹（Extra09 第四章）。模型侧与框架侧各自负责什么，见[模型与框架的职责边界](node:responsibility)。

## 机制深挖

- [评估设计四要素](node:evaldesign)：任务集怎样组成，基线怎样设置，教材中各类判定方法的规则与局限，以及重复运行的必要性。
- [评输出与评轨迹](node:outputtrajectory)：两种评估各看什么，四种组合分别说明什么，轨迹需要记录哪些内容。
- [失败集与回归](node:regression)：失败怎样记录与分类，回归怎样发现，评估成本怎样分层控制。

## 与相邻知识点的关系

- [停止条件设计](node:stopcond)：停止原因是轨迹评估中的关键字段。
- [终止判定的漏判](node:terminate)：假完成与假进行需要通过轨迹发现。
- [模型与框架的职责边界](node:responsibility)：改动需要区分属于哪一侧，并分开评估。
- [评估与训练](node:evaluation)：公开基准、可观测性、Agentic RL 与自进化在该部分定位。

# 评估设计四要素

## 定位

本节是[任务评估](node:taskeval)的机制深挖，展开固定任务集、基线、事先确定标准与多次运行四个要素，并对照教材第 12 章中的具体做法，说明各自的规则与局限。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

四个要素分别排除一种“比较不成立”的情况：

| 要素 | 排除的问题 |
|---|---|
| 固定任务集 | 改动前后测的不是同一批任务，差异来自任务本身 |
| 基线 | 没有对照，只能凭印象判断“好像变好了” |
| 事先确定标准 | 看到结果后再调整判定规则，比较被结果本身左右 |
| 多次运行 | 单次运行的偶然结果被当作改动的效果 |

缺少其中任何一项，评估得到的数字都难以支持“这次改动让智能体变好了”这一结论〔待核验〕。

## 机制深挖

### 固定任务集

**覆盖类型，包括反例。** BFCL 把工具调用分为单函数调用、多函数调用、并行调用与判断是否需要调用四个类别（12.2.1）。第四类检验的是智能体在不该调用工具时能否不调用；只测“该行动”的任务，会漏掉“过度行动”这类失败。GAIA 按复杂度与所需推理步骤把任务分为三个难度级别，并用难度递进下降率观察能力随难度增加如何衰减（12.3.1）。

**任务要带标准答案或判定依据。** BFCL 的每个样本包含问题、可用函数列表与期望的函数调用（12.2.1）；GAIA 的样本包含标准答案，以及标注者记录的推理步骤与所需工具（12.3.1）。后者不仅能判定最终答案，也为评估过程提供了参考。

**平衡规模与成本。** 教材建议渐进式评估：先用 5 个样本快速测试，准确率超过阈值再扩大到 50 个，最后才运行全部样本（12.2.6）。第 12 章习题进一步提出分层评估策略：日常迭代用低成本的快速评估，版本发布前用标准评估，重大更新时用全面评估（第 12 章习题 5）。

### 基线

基线是改动前的版本，在同一任务集、同一设置下运行。教材的对比评估示例在同一类别上各取 10 个样本，比较默认提示词与优化提示词两种配置（12.2.6）。要让这种对比有效，除被比较的那一处改动之外，其余条件都应保持一致：模型、采样温度、工具集、步数上限与任务样本〔待核验〕。样本很少、每个配置只运行一次时，几个百分点的差异很难与随机波动区分〔待核验〕。

公开排行榜上的分数不能直接当作自己改动的基线，因为排行榜结果来自不同的实现与设置。教材在讨论提升 BFCL 成绩时，也建议使用官方评估工具验证，确保结果与排行榜标准一致（12.2.6）。

### 事先确定标准

教材展示的自动判定方法可以分为三类——规则匹配、评分量表与成对比较；其中规则匹配在教材中有抽象语法树匹配与准精确匹配两种具体形式：

| 方法 | 判定方式 | 适用 | 局限 |
|---|---|---|---|
| 抽象语法树匹配（BFCL） | 函数名精确一致；参数集合相等，顺序可以不同；参数值语义等价（如 `2+3` 与 `5`）；多个调用按集合匹配 | 结构化的工具调用 | 只判定调用本身，不判定调用之后的结果 |
| 准精确匹配（GAIA） | 先归一化再精确比较：数字去掉千分位分隔与单位，字符串转小写并去掉冠词与末尾标点，列表排序后比较 | 答案简短、形式可规范化的问题 | 语义等价但形式不同的答案可能被判错；要求输出遵循固定模板 |
| 评分量表（LLM Judge） | 由模型按多个维度打 1–5 分，汇总为平均分、及格率（平均分不低于 3.5）与优秀率（不低于 4.5） | 开放式生成内容 | 评审模型可能偏好某种风格，或对长度敏感 |
| 成对比较（Win Rate） | 由模型判断两份结果哪个更好，统计胜、负、平的比例 | 与参考结果比较相对质量 | 胜率显著高于预期时，可能是评估标准本身存在偏差 |

依据：12.2.1、12.3.1、12.4.1；LLM Judge 的风格偏好与长度敏感问题见第 12 章习题 4。

人工验证适用于自动判定不可靠的场景。教材的人工验证流程要求验证者按正确性、清晰度、难度匹配与完整性打分，并把结果标注为通过、拒绝或需要修改（12.4.1、12.4.6）。

判定方法对输出格式有要求。GAIA 规定模型必须以固定的“FINAL ANSWER:”模板给出答案，并约定了数字、字符串与列表的写法（12.3.1）；答案不遵循模板，准精确匹配就无法工作。这与[终止判定的漏判](node:terminate)中“完成信号应当显式”的结论是同一件事：能被程序可靠判定的结果，必须有明确的输出约定。

“事先”确定的意义在于判定规则不随结果调整。社区补充章节在项目推进上有相近的主张：先定义验收标准，再扩展能力边界（Extra09 第七章）。

### 多次运行

教材在调试建议中把采样温度设为 0 以保证输出的确定性（4.2.4），但没有讨论评估中的重复运行。以下几点属于本板块的判断，均待核验：

- 即使采样温度为 0，通过接口调用的模型在不同请求之间也可能给出不同的输出〔待核验〕；
- 依赖外部环境的任务（如 GAIA 中需要网页浏览的问题）会随环境变化而变化，同一任务在不同时间运行结果可能不同〔待核验〕；
- 因此比较两个版本时，应对每个任务运行多次，以通过率及其波动作为比较对象，并在报告中注明运行次数〔待核验〕。

- 原文位置：4.2.4；12.1.1、12.2.1、12.2.6、12.3.1、12.4.1、12.4.6、第 12 章习题 4 与 5。社区补充：Extra09 第七章。

# 评输出与评轨迹

## 定位

本节是[任务评估](node:taskeval)的机制深挖，说明评估最终输出与评估执行轨迹各自看什么、为什么两者都需要，以及评估轨迹需要记录哪些内容。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

**输出**是智能体最终交付的结果：一个答案、一份报告、一次修改。**轨迹**是得到这个结果的全过程：每一轮模型收到的输入与给出的输出、发起的工具调用与参数、工具返回的结果、最终的停止原因，以及沿途消耗的 token 与时间。

把两种评估的结论组合起来，会得到四种情况：

| | 轨迹合理 | 轨迹不合理 |
|---|---|---|
| **输出正确** | 可以保留的成功 | 结果对了，但过程靠运气、绕了远路或产生了多余副作用，换一个任务可能就会失败 |
| **输出错误** | 过程基本正确，错在个别环节，轨迹能指出具体位置 | 需要从轨迹中找出最早偏离的一步 |

只评输出，会把右上角当作成功，也无法区分左下角与右下角〔待核验〕。只评轨迹，又容易把“与参考路径不同”误判为错误：教材指出同一问题可能有多个正确答案（12.1.1），完成任务的合理路径同样不止一条。所以轨迹评估更适合检查约束——是否调用了不该调用的工具、是否超出预算、是否出现重复的无效调用——而不是要求与某条参考路径完全一致〔待核验〕。

## 机制深挖

### 教材中的两种视角

| 评估 | 看的是 | 属于 |
|---|---|---|
| BFCL | 给定问题与可用函数，模型给出的函数调用是否与期望一致（12.2.1） | 单步决策，轨迹中的一个环节 |
| GAIA 精确匹配率与分级准确率 | 最终答案是否正确（12.3.1） | 输出 |
| GAIA 平均推理步骤数 | 正确回答的样本平均用了多少步（12.3.1） | 轨迹统计 |
| 效率与鲁棒性指标 | token 用量、响应时间、错误率、故障恢复（12.1.2） | 轨迹统计 |
| 习题中的扩展 | 有依赖关系的多个调用的执行顺序、是否用了最少的调用次数、错误类型分析报告（第 12 章习题 2） | 轨迹 |

BFCL 中判断是否需要调用函数的类别，检验的是“不该调用时不调用”（12.2.1），这是只看最终输出无法覆盖的决策质量。GAIA 样本中标注者记录的推理步骤与所需工具（12.3.1），可以作为评估轨迹时的参考，但不宜要求逐步一致〔待核验〕。

### 只在轨迹中可见的失败

有些失败在输出中完全不可见，或者看起来只是“答错了”：

- **假完成**：格式出错或中途纯文本被当作最终回答，输出表现为一个不完整或答非所问的回答；轨迹中能看到任务在很少的步数内结束，而最后一轮本应是工具调用（见[终止判定的漏判](node:terminate)）。
- **假进行**：同一调用重复出现、观察结果不再变化，最终因预算耗尽而结束（见[停止条件设计](node:stopcond)）。
- **证据不足**：工具结果被截断而没有告知，模型基于部分信息作答（见[工具结果处理](node:toolresult)）。
- **重复与遗漏**：已完成的步骤被再次执行，或计划中的步骤被跳过（见[任务状态](node:taskstate)）。

### 轨迹的记录范围

社区补充章节给出了一个完整的轨迹记录范围：每一轮的模型输入与输出、工具调用参数、工具返回结果与 token 用量（Extra09 第六章），并提出几条设计原则：用结构化数据而不是文本描述记录事件；记录时带上当时的步数、token 用量等上下文；保留失败的尝试，而不是只留最终结果；同时提供便于程序分析与便于人阅读的两种格式。

其中“每一轮模型实际收到的输入”最容易被省略，而它决定了一次错误决策能否被解释——社区补充章节中有一个模型反复误用写入工具的案例，查看完整轨迹后才发现上下文里缺少判断所需的任务信息（Extra09 第四章）。这类判断属于[模型与框架的职责边界](node:responsibility)。

## 实验与原文

- 暂无配套实验。
- 原文位置：12.1.1、12.1.2、12.2.1、12.3.1、第 12 章习题 2。社区补充：Extra09 第四、六章。

- [失败集与回归](node:regression)：轨迹是失败分类与回归定位的依据。
- [终止判定的漏判](node:terminate)、[停止条件设计](node:stopcond)、[工具结果处理](node:toolresult)、[任务状态](node:taskstate)：这些知识点中的失效，多数需要在轨迹中发现。

# 失败集与回归

## 定位

本节是[任务评估](node:taskeval)的机制深挖，说明如何把评估与实际使用中出现的失败沉淀下来，并用它们防止后续改动让已经解决的问题重新出现。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 核心解释

智能体的改动经常是“修好一处、弄坏另一处”：为解决某类失败而加的一条规则、一个工具或一次模型更换，可能改变其他任务上的行为。社区补充章节记录过这样的取舍：删减提示词中的搜索策略描述后，模型确实少搜了很多无关文件，但漏掉相关文件的比例也随之上升（Extra09 第四章）。只看这次想修的问题，就发现不了代价。

防止这种情况需要两件事：

1. **失败集**：把失败案例连同完整轨迹记录下来，按失败类型归类，并补充进固定任务集，使它们成为之后每次评估都会运行的任务〔待核验〕。
2. **回归检查**：每次改动后，在包含这些案例的任务集上重新运行，**逐个任务**与基线对比，而不只比较总体通过率；总体通过率不变时，也可能有一些任务从通过变为失败、另一些从失败变为通过〔待核验〕。

教材在这方面提供了起点：实践建议要求分析失败案例、找出智能体的薄弱环节（12.2.6）；习题要求生成错误类型分析报告，并设计定期运行评估、在性能下降时告警的持续评估系统（第 12 章习题 2、5）。社区补充章节在讨论检索优化时，把用黄金数据集持续评估、迭代优化检索策略的做法称为闭环优化（Extra02）。

## 机制深挖

### 失败记录的内容

一条失败记录至少应能回答三个问题：任务是什么，智能体做了什么，为什么判定为失败〔待核验〕。对应到记录内容：

- 任务输入与判定依据（标准答案、判定规则或评分量表）；
- 完整轨迹，包括失败的尝试，而不只是最终结果——社区补充章节强调失败轨迹往往比成功路径更有价值，不应被“清洗”（Extra09 第六、七章）；
- 失败类型，例如调用错误、参数错误、假完成、假进行、证据不足、重复或遗漏步骤；
- 初步判断的所属一侧（模型或框架），用于决定改进落在哪里（见[模型与框架的职责边界](node:responsibility)）。

教材的 BFCL 习题要求统计“哪些类型的错误最常见”（第 12 章习题 2），第 11 章在训练后的模型评估中也单独设有错误分析小节（11.5.3）。按类型统计失败，才能判断一次改动针对的是主要问题还是个别案例。

### 不改代码也会回归

第 12 章习题指出，智能体的性能可能随时间变化，例如依赖的外部 API 发生变化、用户需求发生变化（第 12 章习题 5）。这意味着回归不只由自己的改动引起：模型服务的更新、工具所依赖的外部数据变化，都可能让原本通过的任务失败。定期运行固定任务集，才能把这类变化与自身的改动区分开〔待核验〕。

### 控制回归检查的成本

评估每次都需要大量模型调用，成本很高（12.1.1）。回归检查可以分层进行：每次改动只运行与改动相关的类别和最近加入的失败案例；发布前运行完整的固定任务集；定期运行包含外部依赖的全面评估〔待核验〕。这与教材习题提出的“快速评估—标准评估—全面评估”分层策略一致（第 12 章习题 5），也与先小样本、后全量的渐进式评估思路一致（12.2.6）。

## 实验与原文

- 暂无配套实验。
- 原文位置：11.5.3；12.1.1、12.2.6、第 12 章习题 2 与 5。社区补充：Extra02、Extra09 第四、六、七章。

# 应用形态

本部分回答：前六部分的能力组合起来，形成了哪些典型的智能体应用，不同形态的关键难点分别落在哪里。

文中的“教材”指核心材料 Hello-Agents，小节号（如 2.4.5）为教材的章节编号；引用写法与版本见[参考资料](node:refs)。

## 知识点

| 知识点 | 回答的问题 | 教材依据 | 状态 |
|---|---|---|---|
| 协作模式 | 智能体作为开发者工具与作为自主协作者时，人与智能体如何分工 | 1.4.1、1.4.2 | 未展开 |
| 深度研究智能体 | 如何用任务清单驱动检索、总结与报告生成 | 第 14 章 | 未展开 |
| 多智能体应用 | 多个智能体如何在真实业务或模拟环境中分工协作 | 第 13 章、第 15 章 | 未展开 |
| 编码智能体 | 读写代码库的智能体在工具设计、上下文与可观测性上面临哪些特殊问题 | Extra09 | 未展开 |
| GUI 与 Web 智能体 | 通过屏幕或网页界面操作的智能体如何感知界面、执行操作 | Extra06、Extra11 | 未展开 |

## 主线

应用形态不是新的知识类别，而是前六部分在具体场景中的组合。深度研究智能体以任务清单驱动研究流程，并用结构化笔记保存中间结论（第 14 章）；多智能体应用侧重角色划分与协作流程（13.3）；编码智能体集中暴露了工具粒度、大结果处理与可观测性问题（Extra09）；GUI 与 Web 智能体则需要感知并操作为人设计的界面（Extra06、Extra11）。

阅读案例时，重点是识别它在哪个环节做了什么取舍，并回到对应部分理解背后的机制，而不是复述实现细节。

{"label": "深度研究智能体", "node": "", "status": "未展开"}, {"label": "多智能体应用", "node": "", "status": "未展开"}, {"label": "编码智能体", "node": "", "status": "未展开"}, {"label": "GUI 与 Web 智能体", "node": "", "status": "未展开"}]}];
const STATUS={"已发布": "published", "编写中": "writing", "未展开": "pending", "读者前提": "prereq"};
const PARTS=ATLAS.map(function(p){return p.id;});
const CONTENT={},LABEL={},PARENT={},HREF={};
document.querySelectorAll('script[type="text/markdown"]').forEach(s=>CONTENT[s.dataset.node]=s.textContent);
(function walk(ns,parent){ns.forEach(n=>{LABEL[n.id]=n.label;if(n.href)HREF[n.id]=n.href;if(parent)PARENT[n.id]=parent;if(n.children)walk(n.children,n.id)})})(TREE,"");
let done={};
try{done=JSON.parse(localStorage.getItem("agentkb_done")||"{}");}catch(e){}
let currentRoute={id:"root",anchor:""};
if("scrollRestoration" in history){history.scrollRestoration="manual";}
function isOverview(id){return id==="root"||id==="refs"||PARTS.indexOf(id)>=0;}
function attr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function routeUrl(id,anchor){
  let h="#node="+encodeURIComponent(id);
  if(anchor) h+="&anchor="+encodeURIComponent(anchor);
  return h;
}
function routeFromHash(){
  if(!location.hash) return null;
  const raw=location.hash.slice(1);
  const q=new URLSearchParams(raw);
  if(q.has("node")) return {id:q.get("node")||"root",anchor:q.get("anchor")||"",scroll:0};
  const old=decodeURIComponent(raw);
  if(CONTENT[old]||LABEL[old]) return {id:old,anchor:"",scroll:0};
  return null;
}
function getScrollY(){
  const rd=document.getElementById("reader");
  return Math.max(rd?rd.scrollTop:0,window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0);
}
function setScrollY(y){
  const rd=document.getElementById("reader");
  if(rd) rd.scrollTop=y||0;
  window.scrollTo(0,y||0);
}
function currentState(){return {id:currentRoute.id,anchor:currentRoute.anchor||"",scroll:getScrollY()};}
function saveCurrentState(){try{history.replaceState(currentState(),"",location.href);}catch(e){}}
let scrollTimer=null;
function rememberScroll(){clearTimeout(scrollTimer);scrollTimer=setTimeout(saveCurrentState,80);}
function inline(t){return t
  .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,function(m,alt,src){return '<img src="'+src.replace(/^(?:\.\.\/)+/,'')+'" alt="'+alt+'">'})
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(m,txt,url){if(url.indexOf('node:')===0){var r=url.slice(5).split('#'),nid=r[0],an=r[1]||'';return '<a href="'+attr(routeUrl(nid,an))+'" class="xref" data-node="'+attr(nid)+'" data-anchor="'+attr(an)+'">'+txt+'</a>';}var cross=/^\.\.\/(资料|深度学习|机器学习)\//.test(url);var out=/^(https?:|mailto:|#)/.test(url)?url:(cross?url:url.replace(/^(?:\.\.\/)+/,''));return '<a href="'+out+'" target="_blank" rel="noopener">'+txt+'</a>';});}
function md(src){
  src=src.replace(/\r/g,'');
  var M=[];
  src=src.replace(/\$\$([\s\S]+?)\$\$/g,function(_,x){M.push('$$'+x+'$$');return '@@M'+(M.length-1)+'@@';}).replace(/\$([^\$\n]+?)\$/g,function(_,x){M.push('$'+x+'$');return '@@M'+(M.length-1)+'@@';});
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const out=[];let list=false,olist=false,quote=false,code=false,para=[],codebuf=[];
  const fp=()=>{if(para.length){out.push('<p>'+inline(esc(para.join(' ')))+'</p>');para=[]}};
  const cl=()=>{if(list){out.push('</ul>');list=false}if(olist){out.push('</ol>');olist=false}};const cq=()=>{if(quote){out.push('</blockquote>');quote=false}};
  const fc=()=>{if(code){out.push('<pre><code>'+esc(codebuf.join('\n'))+'</code></pre>');code=false;codebuf=[]}};
  const cells=s=>s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const L=src.split('\n');
  for(let i=0;i<L.length;i++){
    const t=L[i].trim();let m;
    if(/^```/.test(t)){if(code){fc();}else{fp();cl();cq();code=true;codebuf=[];}continue;}
    if(code){codebuf.push(L[i]);continue;}
    if(/^\|.*\|$/.test(t)&&i+1<L.length&&/^\|[\s:|-]+\|$/.test(L[i+1].trim())){
      fp();cl();cq();
      var hd=cells(t),bd=[],j=i+2;
      while(j<L.length&&/^\|.*\|$/.test(L[j].trim())){bd.push(cells(L[j].trim()));j++;}
      var tb='<div class="tw"><table><thead><tr>';
      hd.forEach(c=>{tb+='<th>'+inline(esc(c))+'</th>';});tb+='</tr></thead><tbody>';
      bd.forEach(r=>{tb+='<tr>';r.forEach(c=>{tb+='<td>'+inline(esc(c))+'</td>';});tb+='</tr>';});
      out.push(tb+'</tbody></table></div>');i=j-1;continue;
    }
    if(t===''){fp();cl();cq();continue;}
    if(m=t.match(/^(#{1,4})\s+(.*)/)){fp();cl();cq();out.push('<h'+m[1].length+'>'+inline(esc(m[2]))+'</h'+m[1].length+'>');continue;}
    if(t==='---'){fp();cl();cq();out.push('<hr>');continue;}
    if(m=t.match(/^[-*]\s+(.*)/)){fp();cq();if(olist){out.push('</ol>');olist=false}if(!list){out.push('<ul>');list=true}out.push('<li>'+inline(esc(m[1]))+'</li>');continue;}
    if(m=t.match(/^\d+\.\s+(.*)/)){fp();cq();if(list){out.push('</ul>');list=false}if(!olist){out.push('<ol>');olist=true}out.push('<li>'+inline(esc(m[1]))+'</li>');continue;}
    if(m=t.match(/^>\s?(.*)/)){fp();cl();if(!quote){out.push('<blockquote>');quote=true}out.push(inline(esc(m[1]))+'<br>');continue;}
    para.push(t);
  }
  fc();
  fp();cl();cq();
  var html=out.join('\n');
  html=html.replace(/@@M(\d+)@@/g,function(_,i){return M[+i];});
  return html;
}
function typeset(cb){
  if(window.MathJax&&MathJax.typesetPromise){
    MathJax.typesetPromise([document.getElementById("reader")]).catch(function(){}).then(function(){if(cb)cb();});
  }else if(cb){cb();}
}
function tnode(n,lvl){
  const kids=n.children&&n.children.length;
  const href=n.href?' data-href="'+attr(n.href)+'"':'';
  let h='<div class="tnode lvl'+lvl+'" data-id="'+n.id+'"'+href+'><span class="cv">'+(kids?'▸':(n.href?'↗':'·'))+'</span><span class="lbl">'+n.label+'</span><span class="chk">'+(!n.href&&done[n.id]?'✓':'')+'</span></div>';
  if(kids){h+='<div class="kids" data-kids="'+n.id+'" style="display:none">'+n.children.map(c=>tnode(c,lvl+1)).join('')+'</div>';}
  return h;
}
function buildTree(){document.getElementById("tree").innerHTML=TREE.map(n=>tnode(n,0)).join('');}
function revealNode(id){
  let p=PARENT[id];
  while(p){
    const box=document.querySelector('[data-kids="'+p+'"]');
    const t=document.querySelector('.tnode[data-id="'+p+'"]');
    if(box) box.style.display="";
    if(t){const cv=t.querySelector(".cv");if(cv)cv.classList.add("open");}
    p=PARENT[p];
  }
}
function bindXrefs(){
  document.querySelectorAll("#reader a.xref").forEach(a=>{
    a.onclick=function(e){
      if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
      e.preventDefault();
      navigateNode(a.dataset.node,a.dataset.anchor||"");
    };
  });
}
function overviewHtml(){
  const flow='<div class="flow">'+PARTS.map(function(id,i){
    return (i?'<span class="arrow">→</span>':'')+'<a href="'+attr(routeUrl(id))+'" class="xref" data-node="'+attr(id)+'">'+(LABEL[id]||id)+'</a>';
  }).join('')+'</div>';
  const legend='<div class="legend">'+Object.keys(STATUS).map(function(s){return '<span class="chip '+STATUS[s]+'">'+s+'</span>';}).join('')+'</div>';
  const cards=ATLAS.map(function(part){
    const chips=part.points.map(function(p){
      const cls='chip '+(STATUS[p.status]||'pending');
      const inner='<span>'+attr(p.label)+'</span><span class="st">'+attr(p.status)+'</span>';
      return p.node?'<a class="'+cls+' xref" href="'+attr(routeUrl(p.node))+'" data-node="'+attr(p.node)+'">'+inner+'</a>':'<span class="'+cls+'">'+inner+'</span>';
    }).join('');
    return '<article class="atlascard"><a class="xref" href="'+attr(routeUrl(part.id))+'" data-node="'+attr(part.id)+'">'+(LABEL[part.id]||part.id)+'</a><div class="chips">'+chips+'</div></article>';
  }).join('');
  return '<section class="atlas"><h2>Agent 知识图谱</h2><p class="hint">七个部分按知识逻辑排列；卡片内是各部分的知识点，右侧标签表示状态。</p>'+flow+legend+'<div class="atlasgrid">'+cards+'</div></section>';
}
function scrollToAnchor(anchor,smooth){
  const rd=document.getElementById("reader");
  const hs=rd.querySelectorAll("h1,h2,h3,h4");
  for(let i=0;i<hs.length;i++){
    if(hs[i].textContent.indexOf(anchor)>=0){hs[i].scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});return true;}
  }
  return false;
}
function finishScroll(anchor,opts){
  const y=opts&&typeof opts.scroll==="number"?opts.scroll:null;
  const restore=!!(opts&&opts.restore);
  const run=function(){
    if(anchor){if(!scrollToAnchor(anchor,!restore))setScrollY(0);}
    else if(y!==null){setScrollY(y);}
    else{setScrollY(0);}
  };
  run();setTimeout(run,80);setTimeout(run,250);
}
function renderNode(id,anchor,opts){
  let body=CONTENT[id];
  if(!body) body="# "+(LABEL[id]||id)+"\n\n> 🚧 本知识点待编写。";
  currentRoute={id:id,anchor:anchor||""};
  const rd=document.getElementById("reader");
  const overview=isOverview(id);
  rd.classList.toggle("wide",overview);
  const isDone=!!done[id];
  const head=overview?'':'<div class="rdrhead"><button class="markbtn '+(isDone?'done':'')+'" onclick="toggleDone(\''+id+'\',this)">'+(isDone?'✓ 已掌握':'标记已掌握')+'</button></div>';
  let html=md(body);
  if(id==="root") html=html.replace('<p>&lt;!--atlas--&gt;</p>',overviewHtml());
  rd.innerHTML=head+html;
  bindXrefs();
  typeset(function(){finishScroll(anchor,opts||{});});
  revealNode(id);
  document.querySelectorAll('.tnode').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
}
function navigateNode(id,anchor){
  saveCurrentState();
  const st={id:id,anchor:anchor||"",scroll:0};
  history.pushState(st,"",routeUrl(id,anchor));
  renderNode(id,anchor);
}
function toggleDone(id,btn){
  const st=currentState();
  done[id]=!done[id]; if(!done[id])delete done[id];
  try{localStorage.setItem("agentkb_done",JSON.stringify(done));}catch(e){}
  buildTree();bind();updateProg();
  history.replaceState(st,"",location.href);
  renderNode(id,st.anchor,{scroll:st.scroll,restore:true});
}
function updateProg(){
  const ids=Object.keys(LABEL).filter(i=>!isOverview(i)&&!HREF[i]);
  const el=document.getElementById("prog");
  el.textContent=ids.length?'已掌握 '+ids.filter(i=>done[i]).length+'/'+ids.length:'';
}
function bind(){
  document.querySelectorAll('.tnode').forEach(el=>{
    el.onclick=function(e){e.stopPropagation();const id=el.dataset.id;
      if(el.dataset.href){location.href=el.dataset.href;return;}
      const kidsBox=document.querySelector('[data-kids="'+id+'"]');
      if(kidsBox){const showing=kidsBox.style.display!=='none';kidsBox.style.display=showing?'none':'';el.querySelector('.cv').classList.toggle('open',!showing);}
      navigateNode(id);
    };
  });
}

  renderNode(st.id,st.anchor||"",{scroll:st.scroll||0,restore:true});
});
window.addEventListener("scroll",rememberScroll,{passive:true});

buildTree();bind();updateProg();

history.replaceState({id:initial.id,anchor:initial.anchor||"",scroll:0},"",location.href);
renderNode(initial.id,initial.anchor||"",{scroll:initial.scroll||0,restore:true});
