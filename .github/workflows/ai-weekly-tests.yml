name: ai-weekly tests

on:
  pull_request:
    paths: ["资讯/AI/工程/**", ".github/workflows/ai-weekly-tests.yml"]
  push:
    branches: [main]
    paths: ["资讯/AI/工程/**", ".github/workflows/ai-weekly-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r "资讯/AI/工程/requirements.txt"
      - run: python -m unittest discover -s "资讯/AI/工程/scripts/tests" -t "资讯/AI/工程/scripts/tests"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_ALLOW_PROTOCOL: file
