name: ai-weekly tests

on:
  pull_request:
    paths: ["AI资讯/任务/**", ".github/workflows/ai-weekly-tests.yml"]
  push:
    branches: [main]
    paths: ["AI资讯/任务/**", ".github/workflows/ai-weekly-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r "AI资讯/任务/requirements.txt"
      - run: python -m unittest discover -s "AI资讯/任务/scripts/tests" -t "AI资讯/任务/scripts/tests"
