# 周报各榜单的规则参数，算法说明见 ../方案.md 第 3、5 节。
# v0.0 过渡提示词中的同名参数为硬编码，v0.1 起由手册与脚本读取本文件。

github:
  candidates: trendshift_weekly     # 候选来源：Trendshift 报告周周榜（约 25 项）
  sort_by: week_stars               # 报告周 7 天每日新增 star 之和
  top_n: 5
  new_entrants:
    max: 3
    created_within_days: 30         # 以报告周周日为基准
  hn_discussed:
    max: 3                          # HN 热议但不在周榜里的项目，不参与排名
    min_points: 50
  exclude:
    - awesome 类或纯链接合集
    - 越狱提示词合集
    - archived
    - fork
  star_farming:                     # 两个条件同时满足视为疑似刷星，不进榜
    max_fork_to_star_ratio: 0.01    # 本周新增 fork ÷ 本周新增 star
    max_open_issues: 4
  ossinsight_enrich_top: 12         # 只对增量前 12 的仓库请求补充信息

articles:
  source: hn
  min_points: 100
  top_n: 5
  sort_by: [points, num_comments]

releases:
  max_items: 8

topics:
  min: 3
  max: 5

must_read:
  min: 3
  max: 5

hf_papers:
  candidates_top: 10

section_priority: [releases, github, articles, topics]   # 同一事件只在优先级最高的板块详细写
