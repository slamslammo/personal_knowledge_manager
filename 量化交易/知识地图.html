# 量化学习路线图

本地图的主体是「自有量化体系」九章——最终要沉淀的知识结构，当前只保留概念边界说明，正文待课程学完、有判断能力后逐章讨论整理。正在学的课程与参考材料统一放在[资料清单](node:refs)。

| 阶段 | 内容 | 状态 |
|---|---|---|
| 1. 课程学习 | 两门主线课程各自成体系地学 | 🔄 进行中 |
| 2. 对照去重 | 用[两门课程对照](node:coursecompare)决定哪些概念只学一遍 | 🔄 随学随更新 |
| 3. 融会整理 | 讨论确定九章各章内容，从课程材料提炼写入 | 待启动 |
| 4. 实践闭环 | 基于自有体系开展研究实验 | 规划中 |

## 快速入口

- **365 天量化课程（日常学习）**：[课程大纲与本地映射](../365天量化课程.html)，按官方大纲 11 阶段组织，每节课直达本地图文口播页与实验。
- **[Datawhale 量化入门](node:dwq)**：章节进度与已完成实验记录。
- **[两门课程对照](node:coursecompare)**：学任何概念前先查，决定看哪门课。
- **[实验环境](node:env)**：`pkm-quant`，两门课与自有实验共用。

## 首页知识网络怎么读

下方网络图就是自有体系九章：章为层、知识点为网点。实心节点已成文，虚线节点只有边界说明；曲线是节点互引。悬停看关联，点击进入正文。课程内容不进此图——图上只呈现最终属于自己的知识。

<script type="text/markdown" data-node="learningmainline">
# 当前学习主线

## 两条课程并行，而不是互相替代

| 主线 | 定位 | 具体产出 | 不承担什么 |
|---|---|---|---|
| [Datawhale Quant-for-Beginners](https://github.com/datawhalechina/quant-for-beginners) | 实践主线 | 运行 Notebook、理解数据结构、复现计算与最小回测。 | 不负责覆盖全部金融理论和生产系统。 |
| [365 天量化课程（Bilibili）](https://www.bilibili.com/video/BV1yR9qBUE7w/) / [YouTube 公开列表](https://www.youtube.com/playlist?list=PLSTdjIlFps_EsTFQMdAOCnbHokT5gtaLw) | 中文理解主线 | 把已有炒股经验与金融、数据、工程、回测、因子知识连接起来。 | 视频中的结论不自动视为已验证知识。 |

Datawhale 提供“亲手做”的抓手，365 天课程提供“为什么值得做、它和真实交易怎样连接”的语境。两条线遇到同一概念时，统一沉淀到本知识库，而不是生成两份课程笔记。

## 当前学习循环

```text
看一节高相关视频 / 接到一个课程任务
              ↓
写出问题、关键主张和交易含义
              ↓
运行或改写一个最小实验
              ↓
只补实验真正需要的金融、统计和市场知识
              ↓
加入成本、时点、复权、样本外等现实约束
              ↓
形成知识节点、实验报告和待验证问题
```

## 统计数学怎样接入

- 已经掌握的内容直接使用，不重复从定义开始学习。
- 遇到概率、分布、抽样、推断和回归直觉问题时，优先使用 [看见统计·中文版](https://seeing-theory.brown.edu/cn.html)。
- 需要公式、全彩图解或 Python 示例时，按问题查 [Visualize-ML](https://github.com/Visualize-ML) 的《数学要素》《矩阵力量》和《统计至简》。
- 通用统计学习方法继续由 [机器学习知识地图](../../../机器学习/知识地图.html) 承接；QuantEcon 暂时只登记，不设学习任务。
- 金融时间序列与普通机器学习不同：时间顺序、非平稳性、分布漂移、交易成本和多重试验必须单独处理，不能直接套用随机划分和普通交叉验证。

## 近期推进顺序

1. 跟随 Datawhale 完成真实行情、收益率和最小回测。
2. 跟随 365 天课程补齐市场、收益、风险、交易成本、数据清洗和因子直觉。
3. 用自己的持仓或关注标的提出一个可证伪问题。
4. 在 pandas 最小回测跑通后，对照 RQAlpha 的事件回测。
5. 学到因子与截面研究后，用 Qlib 复现一条标准研究工作流。
6. 研究闭环稳定以后，再评估 QuantDinger、vn.py、WonderTrader 或 LEAN 等完整系统。

> 学习完成的标准不是“视频看完”，而是能够解释假设、复现计算、指出数据和回测边界，并说明它是否改变自己的交易判断。

<script type="text/markdown" data-node="freefinance">
# 免费金融与量化阅读

> 本页是[资料清单](node:refs)「免费金融阅读」分类的详情页：记录选读章节、适用场景和边界；资料入口以清单主页的表格为准。数学类前置查[数学基础与量化](node:mathrefs)，读到的结论需要数据核验时配合[数据与财经信息源](node:infosystems)。

本页只收录无需购买即可阅读核心内容、信息密度较高、能承接当前实践的材料。阅读方式是按问题选章节，不要求从第一页读到最后一页。

## 第一层：金融和市场底座

| 资料 | 建议选读 | 适用场景 | 边界 |
|---|---|---|---|
| [OpenStax Principles of Finance 2e](https://openstax.org/details/books/principles-of-finance-2e) | 第 1 章金融工具与市场、第 7 章货币时间价值、第 10–11 章债券与股票、第 15 章风险收益与 CAPM。 | 对收益、贴现、资产、组合和 Beta 建立统一定义。 | 美国市场举例较多；作为概念字典，不作为交易课程顺序通读。 |
| [Zerodha Varsity](https://zerodha.com/varsity/) | Introduction to Stock Markets、Futures、Options、Risk Management、Trading Systems。 | 快速补市场机制、衍生品、仓位和交易成本，章节短且无登录墙。 | 印度交易规则不能直接套到 A 股；规则类结论要回到交易所核验。 |
| [Damodaran Valuation](https://pages.stern.nyu.edu/~adamodar/New_Home_Page/equity.html) | Lecture Notes、Spreadsheets、Data、Practice Problems。 | 研究估值、基本面和价值因子时，用真实公司连接现金流与价格。 | 当前只取讲义、表格和案例，不顺序观看完整真人课程。 |

OpenStax 已提供免费网页和 PDF；Varsity 明确无注册、无付费墙。两者分别解决“定义稳定”和“贴近交易”，不承担量化研究方法本身。

## 第二层：从金融概念进入量化方法

| 问题 | 免费材料 | 为什么保留 |
|---|---|---|
| 因子到底是什么，为什么可能存在溢价 | [MSCI: Foundations of Factor Investing](https://www.msci.com/downloads/web/msci-com/indexes/index-education/follow-the-market-or-try-to-beat-it/Foundations_of_Factor_Investing.pdf) | 33 页把价值、规模、低波、质量和动量连接到风险、行为解释、周期性与可投资指数。 |
| 价值和动量是否独立 | [AQR: Value and Momentum Everywhere](https://www.aqr.com/Insights/Research/Journal-Article/Value-and-Momentum-Everywhere) | 直接查看跨资产、跨市场证据与研究设计，不只接受课程结论。 |
| 为什么最高 Sharpe 可能只是试出来的 | [The Deflated Sharpe Ratio](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2460551) | 把多重试验、非正态收益和选择偏差纳入策略评价。 |
| 怎样识别常见回测陷阱 | [QuantStart Backtesting 系列](https://www.quantstart.com/articles/Successful-Backtesting-of-Algorithmic-Trading-Strategies-Part-I/) | 文章短，能连接换手、交易成本、微观结构和回测实现；作为实践检查表，不作为最终权威。 |

## 按当前课程触发阅读

| 当前主题 | 先读什么 | 随后验证什么 |
|---|---|---|
| 收益率、复利、贴现 | OpenStax 第 7 章 | 简单收益、对数收益、累计净值与现金流时点。 |
| 股票、债券和资产差异 | OpenStax 第 1、10、11 章；Varsity 市场入门 | 交易单位、价格形成、分红、复权和风险来源。 |
| 风险、Beta、组合 | OpenStax 第 15 章；Varsity 风险管理 | 波动率、协方差、回撤和仓位对结果的影响。 |
| 因子 | MSCI → AQR | 因子定义、排序、调仓、换手、周期性和样本外。 |
| 策略参数很多、结果过好 | Deflated Sharpe Ratio | 记录尝试次数，保留真正未参与选型的测试期。 |

## 中文材料的处理

当前中文主线由 Datawhale 和 365 天量化课程承担。其他中文文章只有在能追溯数据、代码或一手来源时才加入；不为了“中文齐全”而收录大量营销号、付费专栏或过时教程。英文材料也不整篇搬运，只把与实验相关的定义、证据、反例和引用沉淀到对应知识节点。

<script type="text/markdown" data-node="mathrefs">
# 数学基础与量化

> 本页是[资料清单](node:refs)「数学基础」分类的详情页：记录每份数学资料的取舍理由、量化主题映射和使用边界；资料入口以清单主页的表格为准。遇到统计推断类问题可与[免费金融与量化阅读](node:freefinance)中的教材互补。

## 定位

数学不作为开始量化实践前必须学完的前置课程，而是在研究问题出现时提供解释工具。本项目当前只保留三个经过确认的入口：看见统计、Visualize-ML 和 QuantEcon。

```text
量化问题
   ├── 概率、分布、推断不直观 ──→ 看见统计
   ├── 需要公式、图解或 Python ──→ Visualize-ML
   └── 进入随机过程与经济模型 ──→ QuantEcon（暂存观察）
```

## 1. 看见统计：当前首选入口

[看见统计·中文版](https://seeing-theory.brown.edu/cn.html)是面向概率统计的中文交互网站，源代码位于 [seeingtheory/Seeing-Theory](https://github.com/seeingtheory/Seeing-Theory)。它通过可操作图形解释六组内容：

| 模块 | 量化中的连接 |
|---|---|
| 基础概率：随机事件、期望、方差 | 期望收益、收益方差、盈亏概率。 |
| 进阶概率：集合、古典概型、条件概率 | 条件信号、胜率、贝叶斯更新。 |
| 概率分布：随机变量、离散与连续分布、中心极限定理 | 收益分布、抽样误差、聚合收益。 |
| 频率派推断：点估计、置信区间、Bootstrap | 策略指标不确定性、因子收益置信区间。 |
| 贝叶斯推断：先验、似然、后验 | 根据新信息更新策略或市场状态判断。 |
| 回归分析：最小二乘、相关性、方差分析 | Beta、因子暴露、相关性与回归诊断。 |

使用方式：先操作图形并用自己的话解释变量变化，再用量化实验的数据重画对应图表。它解决直觉问题，不单独承担严谨推导和时间序列验证。

## 2. Visualize-ML：共同数学底座

[Visualize-ML](https://github.com/Visualize-ML)提供中文全彩图解、分章 PDF 和大量 Python/Jupyter 示例，适合作为机器学习和量化交易共用的数学资料库。当前只建立以下映射：

| 项目 | 建议章节 | 量化用途 |
|---|---|---|
| [《数学要素》](https://github.com/Visualize-ML/Book3_Elements-of-Mathematics) | 函数、导数、偏导、微分、积分、优化入门、概率与统计入门。 | 连续复利、边际变化、梯度、损失函数和最优化。 |
| [《矩阵力量》](https://github.com/Visualize-ML/Book4_Power-of-Matrix) | 向量与矩阵、投影、矩阵分解、特征值、SVD、拉格朗日乘子、数据分解。 | 协方差矩阵、因子暴露、PCA、风险模型和带约束组合优化。 |
| [《统计至简》](https://github.com/Visualize-ML/Book5_Essentials-of-Probability-and-Statistics) | 分布、条件概率、高斯分布、协方差矩阵、蒙特卡洛、统计推断、贝叶斯、回归、PCA。 | 收益与风险分布、模拟、估计误差、因子检验和降维。 |

使用顺序不是 Book 3 → Book 4 → Book 5。遇到问题后直接进入相应章节：

- 不理解概率或估计含义：先看见统计，再查《统计至简》。
- 不理解协方差、投影或 PCA：查《矩阵力量》，再回到《统计至简》的应用章节。
- 不理解梯度、目标函数或约束：查《数学要素》和《矩阵力量》的优化相关章节。
- 需要验证：运行仓库对应章节的 Notebook，并换成收益率、因子或组合数据。

## 3. QuantEcon：先登记，暂不设学习路线

[QuantEcon](https://quantecon.org/)聚合了开源 Python/Julia 讲义、书籍和代码库，其中 [Quantitative Economics with Python](https://python.quantecon.org/)涉及概率、马尔可夫过程、动态规划、经济模型与资产定价。

它与量化的潜在连接较强，但内容以经济学模型为主、跨度和难度较大，目前还不能确定哪些章节最适合本项目。因此当前状态为“已发现、待映射”，不列入近期学习任务。

后续只有在以下问题出现时再评估：

- 市场状态转移和马尔可夫模型；
- 随机贴现、资产定价和风险中性概率；
- 动态资产配置或最优停止；
- 需要把经济机制写成可运行 Python 模型。

评估时记录“问题 → 具体讲义 → 最小代码实验”，不以浏览完整网站作为完成标准。

## 暂不扩展

本节点暂不加入数学视频、更多英文教材、资源大全或面试题仓库。先观察以上材料在真实学习中的命中率；只有现有三类入口无法解释具体问题时，才补充新来源。

# 开源系统与 GitHub 工具

> 本页是[资料清单](node:refs)「开源工具」分类的详情页：记录选型顺序、验收规则和使用边界；资料入口以清单主页的表格为准。工具取数时的来源规范见[数据与财经信息源](node:infosystems)，运行环境统一使用[实验环境](node:env)的 `pkm-quant`。

## 选型顺序

工具按研究阶段选择，不追求一次安装完整量化平台。

```text
pandas 最小回测
      ↓
RQAlpha 对照事件驱动       Qlib 对照因子 / ML 研究流
      ↓                              ↓
交易、组合和数据边界稳定以后再评估完整系统
      ↓
QuantDinger / vn.py / WonderTrader / LEAN / NautilusTrader
```

## 当前优先级

| 优先级 | 项目 | 最适合解决的问题 | 当前判断与边界 |
|---|---|---|---|
| P0 | pandas / NumPy | 把信号、仓位、收益、成本和净值逐行算清楚。 | 当前继续使用；透明度高于过早引入框架。 |
| P1 | [Microsoft Qlib](https://github.com/microsoft/qlib) | 因子表达式、数据集、模型、实验记录、信号分析和回测的研究工作流。 | 因子阶段优先试用；它是研究平台，不等同于券商执行系统，数据复权和 point-in-time 仍需自己审计。 |
| P1 | [RQAlpha](https://github.com/ricequant/rqalpha) | A 股/期货的事件驱动回测、撮合、账户、税费和风险模块。 | 适合与 pandas 最小回测对照；许可证限制非商业使用，不能只看“代码公开”。 |

| P2 | [PyPortfolioOpt](https://github.com/PyPortfolio/PyPortfolioOpt) | 均值方差、有效前沿、风险模型和组合优化。 | 等相关性、组合和约束实验开始后再引入。 |
| P2 | [QuantStats](https://github.com/ranaroussi/quantstats) | 从收益序列生成绩效指标和报告。 | 作为报告与交叉检查工具，指标定义仍需自己核对。 |

## 项目验收模板

任何开源量化系统进入本机环境前，都先回答：

1. 许可证是否允许当前用途，核心模块是否真的开源；
2. 最近发布、提交、Issue 和测试是否显示仍在维护；
3. 数据从哪里来，是否包含退市股票、公司行动和披露时点；
4. 回测是向量化还是事件驱动，成交、费用、滑点和订单生命周期怎样建模；
5. 同一策略能否使用固定数据快照重复运行；
6. 是否能与当前 pandas 基线得到可解释的一致或差异结果；
7. 模拟盘和实盘是否强隔离，密钥、下单、风控和紧急停止是否可审计。

在完成这些检查前，项目状态只标记为“雷达”或“试验”，不因为演示视频、Star 数或 AI 功能直接进入主工具链。

<script type="text/markdown" data-node="dwqrandomwalk">
# 随机游走与布朗运动

## 先给结论

巴舍利耶的合理性不在于“真实股价严格服从正态随机游走”，而在于他给出了一个清晰、可计算、可证伪的**随机基准模型**：如果短期价格变化主要由不可预知的新信息驱动，那么下一步方向不应仅凭过去一步稳定预测，累计不确定性应随时间扩大。

因此，更准确的表述是：

> 布朗运动是研究价格变化的零假设和第一近似，不是对真实市场全部规律的最终描述。

## 从离散随机游走到布朗运动

设每一步价格变化为 $\varepsilon_t$，最简单的离散随机游走是：

$$X_n=X_0+\sum_{t=1}^{n}\varepsilon_t$$

若增量独立同分布，并满足：

$$E[\varepsilon_t]=0,\qquad \operatorname{Var}(\varepsilon_t)=\sigma^2$$

则：

$$E[X_n-X_0]=0$$

$$\operatorname{Var}(X_n-X_0)=n\sigma^2$$

第二条非常重要：时间扩大为原来的 $n$ 倍，方差扩大 $n$ 倍，标准差只扩大 $\sqrt{n}$ 倍。这就是常见“平方根时间缩放”的来源。

在连续时间极限下，可写成巴舍利耶式算术布朗运动：

$$S_t=S_0+\mu t+\sigma W_t$$

其中 $W_t$ 是标准布朗运动，满足：

- $W_0=0$；
- 不相交区间的增量相互独立；
- $W_{t+h}-W_t\sim N(0,h)$；
- 样本路径连续，但几乎处处不可微。

当 $\mu=0$ 时，未来价格变化的条件均值为零。加入漂移后，模型表达的是“在可估计的平均漂移之外，短期变化仍由随机增量主导”。

## 为什么这个模型有合理性

### 1. 新信息在到来前不可知

如果公开信息已经被交易者迅速反映到价格中，下一条真正的新信息就不能从旧价格中被确定性地推出。于是过去一次上涨本身不应保证下一次继续上涨。

这不是说所有市场都完全有效，而是提供一个严格的对照：任何声称能预测价格的规则，都应证明自己优于“下一步不可预测”这一基准，并通过样本外验证和交易成本检验。

### 2. 很多小冲击叠加会趋向稳定分布

一个交易周期内可能同时出现订单、新闻、流动性变化和投资者判断等大量冲击。如果这些冲击足够分散、没有单一因素长期支配，中心极限定理会使聚合变化接近正态分布。这解释了为什么高斯增量是自然的第一模型。

### 3. 模型给出明确、可检验的推论

布朗运动不仅说“价格很随机”，还给出可以验证的量化预测：

- 增量均值接近设定漂移；
- 相邻增量线性相关接近零；
- 上下方向在零漂移时接近各半；
- $h$ 期累计变化方差约为 $h\sigma^2$；
- 固定期限的累计变化服从正态分布。

能够被数据或实验推翻，是它比模糊的“市场不可预测”更有价值的原因。

## Python 实验：验证模型自身推论

实验固定随机种子 82，生成 20,000 条路径，每条 252 步，每步增量服从 $N(0,1)$。这不是用模拟“证明真实市场”，而是检查代码生成的过程是否符合理论。

核心结果：

| 指标 | 模拟结果 | 理论值 |
|---|---:|---:|
| 单步增量均值 | -0.000258 | 0 |
| 单步增量标准差 | 1.000393 | 1 |
| 相邻增量相关系数 | -0.000387 | 0 |
| 相邻两步同方向比例 | 49.9827% | 50% |
| 252 步累计变化为正的比例 | 50.2250% | 50% |
| 252 步累计变化标准差 | 15.8482 | $\sqrt{252}=15.8745$ |

方差时间缩放：

| 期限 $h$ | 模拟方差 | 理论方差 $h\sigma^2$ | 比值 |
|---:|---:|---:|---:|
| 1 | 0.9981 | 1 | 0.9981 |
| 5 | 5.0027 | 5 | 1.0005 |
| 20 | 19.9971 | 20 | 0.9999 |
| 60 | 60.0792 | 60 | 1.0013 |
| 252 | 251.1643 | 252 | 0.9967 |

![巴舍利耶随机游走实验](../../实验/outputs/task2_bachelier_random_walk.png)

实验支持的是：**独立高斯增量确实产生零相关、方向近似各半、方差随时间线性增长的过程。** 它没有检验真实股票是否满足这些假设，因为输入数据本来就是按模型生成的。

## 为什么真实市场不等于标准布朗运动

标准巴舍利耶模型至少有四个明显边界：

1. **价格可能为负**：算术布朗运动没有零下界，长期模拟可能产生负价格。现代入门模型常改用几何布朗运动：

   $$dS_t=\mu S_tdt+\sigma S_tdW_t$$

   它让对数价格服从带漂移的布朗运动，从而保持 $S_t>0$。

2. **正态分布低估极端变化**：真实收益通常具有尖峰、厚尾，极端涨跌比正态模型预期更常见。
3. **波动率并非常数**：大波动往往成簇出现。即使原始收益的线性自相关很低，收益平方或绝对值仍可能存在持续性。
4. **价格会跳跃且市场有微观结构**：公告、停牌、流动性枯竭、买卖价差和离散报价都会破坏连续路径假设。

因此，“收益方向难预测”与“市场没有任何可研究结构”不是同一句话。量化策略可以研究条件波动、横截面差异、风险溢价、执行成本和组合结构，但必须证明这些结构不是样本噪声。

## 对量化研究的实际意义

- 把随机游走当作**零假设**：策略首先应战胜随机或买入持有基准。
- 把低自相关当作提醒：单靠最近一次涨跌预测下一次涨跌通常证据不足。
- 把 $\sqrt{t}$ 缩放当作有条件公式：只有在独立、同分布和方差稳定等假设近似成立时才适用。
- 把模型残差当作研究对象：厚尾、波动聚集和跳跃意味着风险模型需要继续扩展。
- 不把回测盈利直接解释成可预测性：还要检查数据偏差、样本外表现和交易成本。

# 概率优势、复利与凯利仓位

## 先校正一句话

“概率优势 + 合理仓位管理，就能长期稳定盈利”抓住了索普思想的方向，但“稳定盈利”容易造成误解。更准确的表述是：

> 在概率、赔率和重复下注等假设稳定且估计正确时，正优势配合适当仓位可以产生正的长期期望对数增长；它不保证每一期盈利，也不保证没有深度回撤。

仓位公式最初来自 Kelly 1956 年的论文；索普把这一思想用于二十一点和资本市场，使“先确认优势，再决定下注规模”成为量化实践的重要范式。

## 二项下注模型

设：

- 当前财富为 $W$；
- 每次投入财富比例 $f$，且 $0\le f<1$；
- 获胜概率为 $p$，失败概率为 $q=1-p$；
- 每投入 1 单位，赢时获得净利润 $b$，输时损失投入金额。

下一期财富为：

$$W'=\begin{cases}
W(1+bf), & \text{win}\\
W(1-f), & \text{loss}
\end{cases}$$

每次下注的财富算术期望增长率为：

$$\frac{E[W'-W]}{W}=f(bp-q)$$

因此，游戏存在正优势的条件是：

$$bp-q>0$$

如果是等额赔率 $b=1$，条件就是 $p>0.5$。

## 为什么只看财富期望不够

财富经过多次下注是乘法过程：

$$W_n=W_0\prod_{t=1}^{n}(1+R_t)$$

算术期望可能被少数极端幸运路径拉高，不能代表大多数参与者的典型结果。仓位过大时，偶尔暴富的路径可以让平均财富很高，同时多数路径却低于本金。

对数把乘法转成加法：

$$\log\frac{W_n}{W_0}=\sum_{t=1}^{n}\log(1+R_t)$$

因此长期复利更自然的目标是最大化每次下注的期望对数增长：

$$g(f)=p\log(1+bf)+q\log(1-f)$$

对 $f$ 求导：

$$g'(f)=\frac{pb}{1+bf}-\frac{q}{1-f}$$

令 $g'(f)=0$，得到凯利比例：

$$f^*=\frac{bp-q}{b}=p-\frac{q}{b}$$

并且：

$$g''(f)=-\frac{pb^2}{(1+bf)^2}-\frac{q}{(1-f)^2}<0$$

所以 $f^*$ 是唯一最大值，而不是任意驻点。

## 52% 胜率为什么对应 4% 仓位

实验设置等额赔率 $b=1$、胜率 $p=0.52$，则：

$$q=0.48,\qquad f^*=0.52-0.48=0.04$$

也就是每次投入当前财富的 4%。对应的理论期望对数增长率为：

$$g(0.04)=0.52\log(1.04)+0.48\log(0.96)\approx0.000800$$

如果胜率实际只有 50%，同样下注 4%：

$$g(0.04)=0.5\log(1.04)+0.5\log(0.96)\approx-0.000801$$

这说明**仓位管理不能创造优势**。没有优势时，波动拖累会使任何非零固定比例下注的期望对数增长为负；仓位只能把已有优势转化为资金增长，并控制优势判断错误时的损失速度。

## 为什么凯利逻辑成立

### 1. 对数增长对应长期复利

在独立同分布、参数稳定的假设下，大数定律使单位次数的实际对数增长趋近 $g(f)$：

$$\frac{1}{n}\log\frac{W_n}{W_0}\longrightarrow g(f)$$

若 $g(f)>0$，典型财富路径长期呈指数增长；若 $g(f)<0$，典型路径长期衰减。

### 2. 固定比例会随财富自动调整风险

盈利后下注金额增加，亏损后下注金额减少，避免用固定金额让风险相对财富失控。只要 $f<1$，一次失败不会把财富直接降为零。

### 3. 它明确揭示“过度下注”

正优势不意味着仓位越大越好。超过凯利比例后，期望对数增长下降；继续加仓会跨过 $g(f)=0$，让典型路径从增长转为衰减。

## Python 实验：优势相同，只改变仓位

实验固定胜率 52%、等额赔率、初始财富 1，重复下注 1,000 次，并模拟 50,000 个终值。不同策略始终面对同一个概率优势，只改变每次投入比例。

| 策略 | 仓位 | 每次期望对数增长 | 理论期望财富 | 模拟中位财富 | 5% 分位财富 | 低于本金概率 |
|---|---:|---:|---:|---:|---:|---:|
| 不下注 | 0% | 0 | 1.000 | 1.000 | 1.000 | 0.00% |
| 半凯利 | 2% | 0.000600 | 2.225 | 1.822 | 0.644 | 18.02% |
| 全凯利 | 4% | 0.000800 | 4.947 | 2.226 | 0.278 | 27.64% |
| 双倍凯利 | 8% | -0.000003 | 24.408 | 0.997 | 0.015 | 51.72% |
| 过度下注 | 10% | -0.001012 | 54.164 | 0.364 | 0.002 | 63.99% |

![索普与凯利仓位实验](../../实验/outputs/task2_thorp_kelly.png)

结果揭示了四件事：

1. **全凯利最大化长期增长率**：4% 的理论 $g(f)$ 在所有候选仓位中最高。
2. **最大增长不等于最平稳**：全凯利的中位财富高于半凯利，但左尾更深，有限 1,000 次后低于本金的概率也更高。
3. **双倍凯利接近增长边界**：8% 仓位的期望对数增长约为零，中位财富几乎回到初始值。
4. **算术平均会掩盖典型亏损**：10% 仓位的理论期望财富高达 54.164，但中位财富只有 0.364，约 64% 的路径低于本金。少数极端幸运路径抬高了平均数。

这正是索普思想的核心：**先确认优势，再以复利目标选择仓位；只确认“期望收益为正”却忽略下注比例，仍可能长期亏损。**

## 为什么实务中常用半凯利或更低

简单公式假设 $p$、$b$ 已知且长期不变，但金融市场中的优势通常来自历史估计：

- 胜率和盈亏比存在估计误差；
- 收益不是只有赢/输两个结果；
- 交易机会并非独立，相关性会同时放大多个头寸；
- 市场状态、成本、滑点和容量会变化；
- 杠杆、保证金和最大回撤约束会提前终止策略。

如果高估了 $p$ 或低估了损失幅度，计算出的凯利仓位会系统性过大。分数凯利把仓位设为 $c f^*$，其中 $0<c<1$。它牺牲部分理论增长率，换取更浅的回撤、对参数误差更强的容忍度和更高的执行可持续性。

在多资产情形下，简单二项公式不再直接适用，目标可推广为：

$$\max_{\boldsymbol{w}}E\left[\log\left(1+\boldsymbol{w}^{\mathsf{T}}\boldsymbol{R}\right)\right]$$

同时加入杠杆、单资产上限、组合相关性、流动性和回撤约束。实际项目中，凯利更适合用作**仓位上限与敏感性分析工具**，而不是机械执行的唯一答案。

## 对量化研究的实际意义

- 没有经过样本外验证和成本检验的“优势”，不应进入仓位公式。
- 正期望回答“值不值得做”，仓位管理回答“做多大”。
- 平均终值不能代替中位数、分位数、亏损概率和最大回撤。
- 优势越不确定、相关性越高、尾部越厚，实际仓位越应低于理论凯利。
- 凯利结论是条件命题，不是盈利承诺，更不是投资建议。

# 两门课程对照

两门主线课程覆盖面重叠但深度和入口不同。本页的用途是：**学任何一个概念之前先查这里，决定看哪门课、哪门跳过**，避免同一件事学两遍。

## 一句话定位

- **[Datawhale 量化入门](node:dwq)**：8 章走完一条最小闭环，从环境到双均线回测。优点是快、能立刻跑出结果；代价是每个概念都点到为止。
- **[365 天量化课程](../../365天量化课程.html)**：11 阶段 365 课，按研究证据链系统展开。优点是深度和边界讲得透；代价是周期长，且 P4 之后尚未上线。

## 概念覆盖对照

| 概念 | Datawhale | 365 课程 | 怎么学 |
|---|---|---|---|
| 收益率与净值 | 第 2 章 | 第 5 课（多口径与累计净值） | 365 建立口径，Datawhale 动手跑一遍 |
| 复利与贴现 | — | 第 6 课（NPV、IRR） | 只看 365 |
| 波动率与风险 | 第 5 章 | 第 7 课（方差与下行风险） | 以 365 为准，它区分了下行风险 |
| 相关性与分散化 | 第 8 章 | 第 8 课（协方差与分散化） | 重叠度最高，看 365 即可，Datawhale 只做代码练习 |
| Sharpe 与 Beta | 第 6 章 | 第 9 课（OLS 回归 Beta/Alpha） | 互补：Datawhale 给算法，365 给统计含义和适用边界 |
| 最大回撤与仓位 | 第 7 章 | 第 36 课（滚动窗口与回撤） | 互补：Datawhale 讲金融含义，365 讲工程实现 |
| 随机游走与概率优势 | 第 1 章（巴舍利耶、索普） | 第 17–18 课（蒙特卡洛、几何布朗运动） | 互补：Datawhale 给思想来源，365 给模型假设 |
| **双均线策略与最小回测** | **第 3–4 章** | P4 经典策略详解（91–130，未上线） | **Datawhale 独有**，当前唯一完整的「信号→仓位→回测」链路 |
| 统计证据与可预测性 | — | 第 10–16 课 | 只看 365 |
| 衍生品定价与对冲 | — | 第 19–21 课 | 只看 365 |
| 市场微观结构与执行 | — | 第 22–25 课 | 只看 365 |
| Python 量化工具链 | 分散在各章代码 | P2 全 30 课 | 只看 365，成体系 |
| 数据质量、复权、未来函数 | — | 第 61–66 课 | 只看 365 |
| 因子工程与多因子 | — | 第 67–89 课 | 只看 365 |

## 由此得到的分工

**重叠区（Datawhale 第 2、5、6、7、8 章 ↔ 365 P1 的 M2/M3 模块）**：概念以 365 为准，Datawhale 这几章当作动手练习，**不再重复做笔记**。跑代码时如果结论和 365 讲的不一致，记下来——这类差异通常出在简化假设上，是理解加深的入口。

**Datawhale 不可替代的部分**：第 3–4 章。365 的经典策略阶段（P4）还没上线，所以目前只有 Datawhale 能让你完整走一遍从信号到回测的链路。这两章要认真做，做完的结果可以用 365 第 29 课的策略报告结构去升级——补成本、基准、样本外和敏感性。

**365 不可替代的部分**：工具链（P2）、衍生品、微观结构、数据工程、因子工程。这些 Datawhale 完全没有覆盖，是当前知识增量的主要来源。

## 两门课的方法论差异

同一个话题，两门课的严谨度不同，冲突时以更严格的一方为准：

- **回测标准**：Datawhale 的最小回测默认不含手续费、滑点和样本外划分；365 明确要求「回测结果不等于可交易收益」，信号时点、成交规则、费用、冲击、容量必须分开说明。
- **统计口径**：Datawhale 直接给指标计算；365 强调「统计显著不等于经济有效」，要求同时报告效应大小、样本外和基准。
- **数据处理**：Datawhale 直接用下载的行情；365 要求数据契约、point-in-time 和复权口径快照。

这三条差异不是谁对谁错——Datawhale 是入门期的合理简化。但把 Datawhale 的结果当成可信研究结论之前，要用 365 的标准补一遍。

## 维护规则

- 每完成一门课的一个单元，回来更新本表对应行。
- 两门课都讲到的概念，在各自笔记里互相加 `node:` 链接；连线累积到一定密度，就是自有体系里该概念应该独立成节点的信号。
- 本表只做对照，不承载概念正文。

## 使用顺序

<script type="text/markdown" data-node="framework">
# 量化研究框架

量化研究的核心不是自动交易软件，而是把市场判断写成可被数据证伪的假设，再把验证通过的结论转成受风险约束的交易规则。

本部分连接研究问题、数据、信号、仓位、回测、组合、执行和复盘。每一步都有明确输入与输出，后一步不能掩盖前一步的假设缺陷。

一个策略至少要回答：研究对象是什么、信号何时可知、何时成交、持有什么仓位、承担哪些成本和风险、与什么基准比较，以及结果能否在未参与设计的数据上保持稳定。
</script>
<script type="text/markdown" data-node="hypothesis">
# 研究问题与假设

研究问题描述希望解释或利用的市场现象，研究假设则把这种描述变成可计算、可检验的陈述。

例如“短期趋势可能延续”仍然过于宽泛；进一步定义观察窗口、价格口径、信号阈值、持有期、交易对象和评价指标后，才形成可回测假设。

好的假设应在查看最终结果前确定主要规则，同时记录经济或行为动机、适用市场、可能失效的条件和反例。仅从历史曲线中不断试参数直到结果好看，不能构成可靠证据。
</script>
<script type="text/markdown" data-node="researchloop">
# 从研究到交易的闭环

量化流程可以拆成七个连续环节：获取并理解数据、提出假设、生成信号、映射仓位、回测与评价、组合和风险约束、执行与监控。

回测完成并不等于研究结束。交易成本、容量、不同市场阶段和样本外表现可能推翻原结论；模拟盘与实际运行还会暴露数据延迟、订单失败和风控问题。

复盘应回到原假设，判断失败来自数据、实现、市场机制变化还是随机波动，再决定修正、暂停或废弃策略。
</script>
<script type="text/markdown" data-node="market">
# 市场与交易基础

量化模型最终作用于真实市场。交易所规则、交易时段、标的属性、价格形成、订单类型和成交机制会决定一个信号是否能够变成可实现收益。

本部分先建立标的、报价、订单、成交、仓位和盈亏的共同语言，再进入数据与策略。不同市场的涨跌停、最小交易单位、卖空、结算和税费规则不能混用。
</script>
<script type="text/markdown" data-node="instruments">
# 市场与交易标的

股票、ETF、债券、期货、期权和外汇具有不同的收益来源、交易规则和风险结构。开始研究前应明确标的代表的权利、交易单位、交易时间、结算方式、杠杆和是否允许卖空。

同一个策略名称放在不同资产和市场上可能对应完全不同的风险。板块入门实验以股票和 ETF 日线为主，其他标的在需要时另设专题。
</script>
<script type="text/markdown" data-node="orders">
# 价格、订单与成交

行情中的开盘、最高、最低和收盘价是历史统计，不等于任何规模的订单都能以该价格成交。实际成交取决于订单类型、买卖盘、流动性、价差和市场冲击。

市价单优先保证成交，限价单限制价格但可能无法成交。回测必须明确采用哪个时间点的已知信息、在哪个价格假设成交，并为不确定性保留滑点和成交限制。
</script>
<script type="text/markdown" data-node="positionpnl">
# 仓位、资金与盈亏

信号表示研究判断，仓位表示实际持有的风险敞口。仓位还受到可用资金、杠杆、交易单位、风险上限和组合约束影响。

盈亏需要区分已实现与未实现部分，并明确现金、分红、费用和融资成本的处理。策略收益通常由前一时点已经建立的仓位乘以随后发生的标的收益得到，不能把当天收盘后才知道的信号用于赚取当天收益。
</script>
<script type="text/markdown" data-node="datareturns">
# 数据与收益

数据是量化研究的证据基础。价格序列必须先说明来源、字段、时间、复权和缺失处理，才能进一步计算收益、风险和策略结果。

本部分从 OHLCV 和收益率进入，以随机游走与布朗运动建立价格变化的统计基准，再处理交易日对齐、公司行动、数据质量和常见偏差。价格图看起来合理，不代表数据已经适合回测。
</script>
<script type="text/markdown" data-node="ohlcv">
# OHLCV 行情数据

OHLCV 通常表示一个周期内的开盘价、最高价、最低价、收盘价和成交量。每一行对应哪个交易所时区、哪个时间区间，以及收盘价是否调整，必须在分析前确认。

行情下载后应检查索引排序、重复日期、缺失值、异常跳变、字段类型和样本区间。多层列索引或不同数据接口的字段差异应在数据入口统一处理，而不是散落在策略代码中。
</script>
<script type="text/markdown" data-node="returns">
# 收益率与净值

简单收益率描述相邻价格的相对变化：

$$r_t=\frac{P_t-P_{t-1}}{P_{t-1}}=\frac{P_t}{P_{t-1}}-1$$

连续多期的简单收益不能直接相加，净值需要通过增长因子连乘：$V_t=V_0\prod_{i=1}^{t}(1+r_i)$。对数收益率具有可加性，但组合计算和实际资金变化仍需注意所用定义。

价格上涨幅度、策略收益、累计收益和年化收益属于不同概念，文档与代码应明确区分。
</script>
<script type="text/markdown" data-node="alignment">
# 复权、交易日历与数据对齐

分红、拆股和配股会改变名义价格。使用不复权、前复权或后复权数据会影响收益率与信号，研究中必须固定口径并说明原因。

不同市场和标的可能拥有不同交易日历。多标的合并时，内连接、外连接和缺失填充隐含不同假设；简单删除所有缺失行可能改变样本范围，向前填充也可能把停牌误作正常可交易。

> 🚧 本节点是自有体系的目标位置，正文待课程学完后讨论整理。
</script>
<script type="text/markdown" data-node="databias">
# 数据质量与偏差

数据错误会以异常价格、重复记录、错误复权、时间戳错位或字段含义变化的形式进入研究。数据处理步骤应可重复，并保留原始来源与获取日期。

回看今天仍存在的股票会产生幸存者偏差；使用后来修订的财务数据会破坏时点真实性；用未来成分股列表回测过去也会提前泄露信息。可靠数据应尽量满足“在当时能够获得”的 point-in-time 原则。

> 🚧 本节点是自有体系的目标位置，正文待课程学完后讨论整理。
</script>
<script type="text/markdown" data-node="randomwalk">
# 随机游走与布朗运动

随机游走是价格研究的零假设：若短期价格变化主要由不可预知的新信息驱动，下一步方向就不应仅凭过去一步稳定预测，累计不确定性随时间按平方根扩大。

它的价值不在于描述真实市场的全部规律，而在于提供一个可计算、可证伪的基准：任何声称能预测价格的规则，都应证明自己优于“下一步不可预测”。

> 🚧 本节点是自有体系的目标位置，正文待课程学完后讨论整理。
</script>
<script type="text/markdown" data-node="strategy">
# 策略与信号

策略把研究假设转化为一组明确规则。规则至少包括输入数据、特征或指标、信号条件、仓位映射、调仓频率、退出方式和风险限制。

信号不是收益本身。策略设计应区分“观察到什么”“据此希望持有什么”“何时能够成交”三个层次，避免把指标曲线、买卖标记和实际仓位混为一谈。
</script>
<script type="text/markdown" data-node="signalposition">
# 信号、仓位与调仓

信号可以是离散的买入、空仓、卖空判断，也可以是连续分数。仓位映射进一步把信号转换为资金比例、目标股数或风险预算。

调仓发生在目标仓位与当前仓位不同的时候。研究中应保留信号、目标仓位、实际仓位、仓位变化和成交动作等独立列，使收益归因和成本计算能够被检查。
</script>
<script type="text/markdown" data-node="movingaverage">
# 趋势与移动平均线

移动平均线通过对一段历史价格求平均来平滑短期波动。短期均线高于长期均线可被解释为近期价格相对更强，并构造为趋势信号。

双均线策略适合展示“指标 → 信号 → 仓位 → 收益”的第一条完整链路，但它不自动证明趋势可以持续。窗口选择、震荡期频繁交易、信号滞后、成本和不同样本区间都可能显著改变结果。
</script>
<script type="text/markdown" data-node="factorsignal">
# 因子与截面信号

因子通常为多个标的在同一时点计算可比较的特征，用于排序、分组或组合加权。它与单一标的沿时间生成的择时信号属于不同研究结构。

因子研究需要明确股票池、计算时点、财务数据可得时间、标准化、中性化、分组方式、换手和持有期。后续多因子专题将在该基础上讨论因子有效性与组合构建。
</script>
<script type="text/markdown" data-node="backtest">
# 回测与评估

回测是在明确历史信息边界和成交假设的前提下，模拟策略过去可能如何运行。它用于排除明显无效或不可实现的想法，不能预测未来必然盈利。

完整回测应串联数据、信号、仓位、交易、成本、净值、基准、绩效指标和样本外验证，并能够追溯任一时点为什么持有该仓位。
</script>
<script type="text/markdown" data-node="timing">
# 信号时序与因果

回测必须保证每个决策只使用当时已经知道的信息。若用第 $t$ 日收盘价计算信号，通常不能再用该信号赚取同一天从 $t-1$ 到 $t$ 的收益。

最小日线示例可以把信号延后一日形成实际仓位，再用仓位乘以当日收益。更真实的设计还需说明信号计算时刻、下单时刻、成交价格、数据发布时间和市场时区。

> 🚧 本节点是自有体系的目标位置，正文待课程学完后讨论整理。
</script>
<script type="text/markdown" data-node="costbenchmark">
# 交易成本与基准

策略毛收益需要扣除佣金、税费、买卖价差、滑点、融资成本和市场冲击，才能接近可实现收益。成本通常与换手率、订单规模和流动性相关，而不是固定不变。

基准用于回答策略是否真的提供了额外价值。常见基准包括同一标的买入持有、相应市场指数、现金或同风险水平的简单组合。比较时必须使用相同时间区间和收益口径。
</script>
<script type="text/markdown" data-node="metrics">
# 绩效指标

累计收益只描述终点，不能说明实现过程。策略评价通常同时观察年化收益、年化波动率、Sharpe、最大回撤、回撤持续时间、胜率、盈亏比、换手率和相对基准表现。

单个指标无法概括策略。高胜率可能伴随少数巨额亏损，高 Sharpe 也可能来自不稳定估计或被忽略的尾部风险。指标定义、无风险利率和年化方法应在实验中固定并说明。
</script>
<script type="text/markdown" data-node="backtestbias">
# 回测偏差与过拟合

前视偏差、幸存者偏差、选择偏差、重复试验和参数搜索都会让历史结果过于乐观。对同一数据尝试足够多的策略，总能偶然找到一条漂亮曲线。

研究应记录尝试次数和参数选择依据，保留简单基准，并检查结论是否依赖少数日期、单一标的或特定市场阶段。不能只展示表现最好的组合而隐藏其他实验。
</script>
<script type="text/markdown" data-node="validation">
# 样本外与滚动验证

样本内数据用于形成假设和选择参数，样本外数据用于评价未见时期的表现。二者反复混用后，所谓样本外也会逐渐成为训练信息。

时间序列不能随意随机打乱。扩展窗口、滚动窗口和 walk-forward 验证遵循时间顺序，能够观察策略在不同市场阶段的稳定性，同时更接近真实的定期重训和调参过程。
</script>
<script type="text/markdown" data-node="riskportfolio">
# 风险与组合

收益必须与承担的风险一起解释。风险既包括日常波动，也包括深度回撤、尾部损失、流动性不足、模型失效和多个头寸同时暴露于同一因素。

组合管理把单个策略或标的的预期收益与相关结构转化为整体仓位。概率优势与凯利准则解释“有优势后做多大”，预算、上限、分散化和再平衡则进一步控制估计误差与风险集中。
</script>
<script type="text/markdown" data-node="volatility">
# 波动率

波动率常用收益率标准差度量，描述收益围绕均值变化的幅度。日波动率在独立同分布等简化假设下可乘以 $\sqrt{252}$ 年化，但交易日数和分布假设应按市场与数据频率说明。

历史波动率是对不可直接观测风险状态的估计，会随样本窗口和市场阶段变化。它不能区分上涨和下跌，也不能完整描述跳跃、偏度和尾部风险。
</script>
<script type="text/markdown" data-node="sharpebeta">
# Sharpe 与 Beta

Sharpe 比率用单位波动所获得的超额收益近似衡量风险调整后表现：

$$\text{Sharpe}=\frac{R_p-R_f}{\sigma_p}$$

Beta 衡量标的收益对市场收益变化的线性敏感度：

$$\beta=\frac{\operatorname{Cov}(R_i,R_m)}{\operatorname{Var}(R_m)}$$

两者回答不同问题：Sharpe 面向整体风险收益效率，Beta 面向市场系统性暴露。估计结果都会随样本和频率变化。
</script>
<script type="text/markdown" data-node="drawdownposition">
# 最大回撤与仓位管理

回撤表示当前净值相对历史峰值的下降，最大回撤是样本期内最深的一次下降。它更接近资金和心理承受能力，但高度依赖观察区间，不能单独代表未来最坏情况。

仓位管理决定同一策略信号承担多少风险。降低仓位通常同时压低收益与回撤；固定比例、波动率目标、风险预算和止损规则具有不同假设，需要结合成本与组合相关性评价。
</script>
<script type="text/markdown" data-node="correlation">
# 相关性与分散化

相关系数描述两个收益序列的线性共同变化。将低相关资产放在同一组合中，可能在不同比例下减少整体波动。

相关性不是固定常数，在市场压力时期可能快速上升。低历史相关也不代表不存在共同尾部风险；标的数量增加只有在风险来源真正不同且权重合理时才形成有效分散化。
</script>
<script type="text/markdown" data-node="portfolio">
# 组合构建与再平衡

组合构建把多个标的或策略的信号转成权重。等权组合是清晰基准，进一步方法可以依据波动率、协方差、风险预算、预期收益或约束条件分配资金。

权重会随价格变化而漂移，再平衡用于恢复目标风险结构，同时产生换手和成本。评价组合时应明确调仓频率、权重上限、现金、卖空、杠杆和估计窗口。
</script>
<script type="text/markdown" data-node="kellyposition">
# 概率优势与凯利仓位

正的概率优势只有配合合理仓位才能转化为长期增长。凯利公式给出使对数增长期望最大的下注比例；过度下注即使算术期望为正，典型路径仍可能长期亏损。

仓位决策因此不是“越大越好”，而是在优势估计误差、回撤承受力和长期增长率之间取平衡。

> 🚧 本节点是自有体系的目标位置，正文待课程学完后讨论整理。
</script>
<script type="text/markdown" data-node="execution">
# 执行与系统

研究回测给出理想化规则，执行系统负责在真实时间、数据和账户约束下运行这些规则。数据延迟、网络失败、订单拒绝和异常行情都可能使实际仓位偏离研究目标。

本部分覆盖交易成本与流动性、模拟盘到实盘的过渡，以及运行监控和风控。它不以直接实盘为目标，而是说明研究结论进入现实前必须补齐的工程边界。
</script>
<script type="text/markdown" data-node="transaction">
# 交易成本与流动性

佣金和税费是显式成本，买卖价差、滑点、延迟和市场冲击是隐式成本。订单规模相对市场成交量越大，成交价格越可能偏离回测假设。

策略容量表示在收益优势被成本消耗前能够承载的大致资金规模。高换手策略即使毛收益较好，也可能在真实执行中失去可行性。
</script>
<script type="text/markdown" data-node="paperlive">
# 从模拟盘到实盘

模拟盘用于检查数据更新、信号生成、订单逻辑、持仓同步和运行稳定性，但通常不能完整模拟排队、冲击和极端行情。

从研究到真实资金应分阶段验证：离线复现、前向纸面记录、模拟账户、小规模受限运行，再根据预先定义的风控标准决定是否继续。任何阶段发现数据或订单异常，都应优先停止而不是自动追单。
</script>
<script type="text/markdown" data-node="monitoring">
# 监控、日志与风控

运行系统需要记录数据版本、信号、目标仓位、订单、成交、费用、实际持仓和异常。只有完整日志才能解释回测、模拟盘与实际结果为何不同。

风控至少包括仓位和杠杆上限、单标的集中度、损失与回撤阈值、数据过期检测、订单失败处理和人工停机入口。监控指标应区分策略正常波动与系统故障。
</script>
<script type="text/markdown" data-node="advanced">
# 进阶专题

因子、时间序列、机器学习和深度学习都应接入同一量化研究闭环，而不是绕过数据质量、时间因果、成本和样本外评价。

进阶模型增加表达能力，也增加参数、验证难度和过拟合风险。进入本部分前，应先能独立完成一个包含基准、成本、风险指标和样本外区间的简单策略实验。
</script>
<script type="text/markdown" data-node="multifactor">
# 因子与多因子

因子研究检验某个可观测特征是否与未来横截面收益存在稳定关系。单因子需要经过排序、分组、信息系数、换手、行业和规模暴露等检查。

多因子模型组合多个信息来源，并处理相关性、权重、冗余与约束。有效性评价必须使用当时可得数据和历史股票池，避免把未来财务信息或成分股带回过去。
</script>
<script type="text/markdown" data-node="timeseries">
# 时间序列研究

金融时间序列具有顺序、非平稳、波动聚集和结构变化等特征。趋势、均值回归、季节性、波动率和状态切换是常见研究对象。

时间序列建模应先建立朴素基准，严格按时间划分数据，并检查预测误差能否在成本后转化为交易价值。预测指标改善不必然带来更好的组合表现。
</script>
<script type="text/markdown" data-node="mlquant">
# 机器学习量化

机器学习可以用于收益分类或回归、横截面排序、风险估计、市场状态识别和文本特征提取。问题定义、标签时间区间和特征可得时间比模型复杂度更先决定结果是否可信。

实验应使用时间顺序验证、Pipeline 和严格防泄漏处理，并与简单线性模型和规则策略比较。通用模型与评估基础由[机器学习知识地图](../../../机器学习/知识地图.html)承接。
</script>
<script type="text/markdown" data-node="dlquant">
# 深度学习与 AI 量化

RNN、LSTM、Transformer 和其他深度模型能够处理复杂序列或非结构化数据，但金融样本的低信噪比、分布漂移和标签重叠会放大过拟合风险。

深度模型仍需明确预测目标、训练窗口、验证方式、交易成本和基准。网络结构基础由[深度学习知识地图](../../../深度学习/知识地图.html)承接，本节点重点关注它们进入量化研究后的数据与评价边界。
</script>
<script type="text/markdown" data-node="practice">
# 实验实践

实验把概念转成可检查的计算过程。每次实验从一个明确问题开始，固定数据与假设，保留代码和输出，再用观察与结论回答原问题。

课程复现负责确认基础链路能够运行；扩展实验负责加入成本、反例、不同样本和样本外验证。正文解释概念，Notebook 展示计算，静态报告用于直接阅读。
</script>
<script type="text/markdown" data-node="env">
# 实验环境

量化实验不仅要“在当前电脑上跑通”，还要能说明使用了什么 Python、什么库、什么数据源，并在以后尽可能复现同一结果。本项目用 `environment.yml` 定义名为 `pkm-quant` 的独立环境，避免与系统 Python 或其他项目互相污染。

## 工具链分层

| 层次 | 当前工具 | 作用 |
|---|---|---|
| 环境管理 | Miniforge / Conda | 创建隔离环境，统一管理 Python 和需要编译的科学计算依赖。 |
| 语言运行时 | Python 3.11 | 执行数据处理、研究、回测和可视化代码。 |
| Python 包管理 | pip | 安装 PyPI 上更新更及时或 Conda 当前无法完整求解的包。 |
| 交互研究 | JupyterLab | 把代码、图表、公式、观察和结论放在同一份 Notebook 中。 |
| 内核连接 | ipykernel | 让 Jupyter Notebook 真正使用 `pkm-quant` 中的 Python。 |
| 项目定义 | `environment.yml` | 声明依赖来源与固定版本，用于重建和同步环境。 |
| 环境验收 | `实验/scripts/check_environment.py` | 检查核心库导入、版本和本地绘图能力，不依赖外部行情服务。 |

Notebook 所显示的内核名称不等同于当前终端环境。遇到“终端能导入、Notebook 不能导入”时，应先在 Notebook 中检查：

```python
import sys
print(sys.executable)
```

本项目应指向：

```text
/opt/homebrew/Caskroom/miniforge/base/envs/pkm-quant/bin/python
```

| 库 | 一句话功能 | 量化场景举例 |

Backtrader 等回测框架属于后续可选工具，当前基础环境暂不安装。入门阶段先用 pandas 明确实现“信号 → 仓位 → 收益 → 指标”的最小回测，有助于理解时间对齐、交易成本和未来数据泄漏；框架应在理解这些机制后再引入。

## Conda、conda-forge 与 Miniforge

这三个名称处于不同层次：

| 名称 | 它是什么 | 本项目中的职责 |
|---|---|---|
| Conda | 环境管理器和包管理器 | 创建 `pkm-quant`、解析依赖、安装/更新包、切换环境。 |
| conda-forge | 社区维护的 Conda 软件包渠道 | 提供适用于不同操作系统和 CPU 架构的预编译软件包及其依赖元数据。 |
| Miniforge | 预配置 conda-forge 的轻量 Conda 发行方式 | 在本机提供 `conda` / `mamba` 命令，并默认只使用 conda-forge。 |
| pip / PyPI | Python 官方生态的包安装工具与包索引 | 在 `pkm-quant` 内补充 Conda 当前无法完整提供或需要更新版本的 Python 包。 |

conda-forge 不是另一个 Python，也不是安装命令。可以把它理解为 Conda 获取软件包的“仓库渠道”：社区维护者编写构建配方，经持续集成构建出 macOS、Linux、Windows 等平台的软件包，再发布到 conda-forge channel。Conda 会读取 channel 的包索引和依赖信息，而不是现场从源码编译每一个科学计算库。

本机当前配置是：

| 配置 | 当前值 | 含义 |
|---|---|---|
| Conda 发行方式 | Miniforge | 基础环境位于 `/opt/homebrew/Caskroom/miniforge/base`。 |
| Conda 版本 | 26.3.2 | 执行环境和包管理。 |
| 依赖求解器 | libmamba | 计算哪些包版本能够同时满足所有约束。 |
| 平台 | `osx-arm64` | Apple Silicon 的 macOS 包。 |
| Channel | `conda-forge` | 同时查询 `osx-arm64` 平台包和 `noarch` 跨平台包。 |
| Channel priority | `flexible` | 当前只有一个 channel，不会发生跨渠道混装；增加其他 channel 时应改为 `strict`。 |

不要把 conda-forge 与 Anaconda 的 `defaults` 渠道随意混合。不同渠道可能使用不同的编译工具链和依赖组合；如果以后必须增加渠道，应记录顺序并设置严格优先级：

```bash
conda config --set channel_priority strict
conda config --show channels channel_priority
```

## 本项目的安装部署流程

`environment.yml` 是安装入口，其中四类信息分别表示：

| 字段 | 当前含义 |
|---|---|
| `name: pkm-quant` | 创建或同步的环境名称。 |
| `channels: [conda-forge]` | Conda 去哪里查询软件包和依赖元数据。 |
| `dependencies` 中的普通条目 | 先由 Conda 求解并安装，例如 Python、NumPy、pandas、JupyterLab。 |
| `dependencies` 中的 `pip` 子列表 | Conda 阶段完成后，再调用该环境自己的 pip 安装，例如 yfinance 和 AkShare。 |

执行 `conda env create -f environment.yml` 时，实际过程是：

```text
读取 environment.yml
        ↓
确定环境名、平台、channel 和版本约束
        ↓
从 conda-forge 读取 osx-arm64 / noarch 包索引
        ↓
libmamba 计算一组互相兼容的包版本
        ↓
下载、校验并提交 Conda 包事务
        ↓
调用 pkm-quant/bin/python -m pip 安装 pip 子列表
        ↓
环境创建完成
        ↓
注册 ipykernel → 本地验收 → 外部数据低频验收
```

几个关键点：

- **依赖求解**不是简单地给每个库取最新版，而是寻找一组全部约束都能满足的版本；缺少某个依赖时可能回退到旧版。
- **Conda 阶段先于 pip 阶段**。Conda 不会自动用 PyPI 的包去满足某个 Conda 包缺失的依赖，因此 yfinance 必须整体放到 pip 子列表。
- **激活环境**只会调整当前终端的命令路径，不会自动修改已有 Notebook 的内核。
- **注册内核**把环境暴露给 Jupyter，但不会重新安装依赖。
- **`--prune` 同步**会清理不再由环境定义需要的 Conda 包，使用前应确保重要依赖已写入 `environment.yml`。
- **验收与安装分开**：安装命令退出成功后仍要检查实际版本、导入、绘图和依赖冲突；行情请求属于第二层外部验收。

可以用以下命令查看安装来源：

```bash
conda list -n pkm-quant --show-channel-urls
```

输出中的 `conda-forge` 表示由 Conda channel 管理，`pypi` 表示由该环境中的 pip 安装。两者可以在同一个环境中共存，但同一个包应尽量只交给其中一种工具管理。

## 为什么同时使用 Conda 和 pip

本项目优先由 Conda 安装 Python、NumPy、pandas、SciPy、Matplotlib、scikit-learn、JupyterLab 等基础包，因为它擅长处理 macOS ARM64 上的二进制依赖。pip 只负责当前需要从 PyPI 安装的包。

如果在 Conda 依赖区只写未固定版本的 `yfinance`，当前 `osx-arm64` 求解器会选择 0.2.57。原因不是该版本被课程指定，而是 yfinance 从 0.2.58 开始依赖 `curl-cffi`，Conda 当前渠道缺少该依赖，于是回退到最后一个可解版本。项目因此在 pip 区显式安装 `curl_cffi`，并固定 `yfinance==1.5.1`。

原则是：**先让 Conda 解决基础科学计算栈，再由同一环境中的 pip 补充少数包；不要交替随意安装同一个包。**

## 创建与同步环境

首次创建：

```

同步已经存在的环境：

```

```bash

```

启动 JupyterLab 后，应在 Notebook 右上角选择 `Python (pkm-quant)`。

## 环境验收

```bash
conda activate pkm-quant
python 实验/scripts/check_environment.py
python -m pip check
jupyter kernelspec list
```

验收分为两个层次：

1. **本地环境验收**：核心库能导入、版本符合预期、Matplotlib 能绘图、`pip check` 无依赖冲突。
2. **外部数据验收**：对指定数据源做一次低频小请求，记录查询日期、接口、标的和返回结果。

外部行情失败不应立即判定为环境失败。例如库能正常导入且 `pip check` 通过，但 Yahoo 返回 HTTP 429，说明失败发生在外部服务链路；此时不应连续重试。

## 数据接口的边界

| Python 接口 | 实际数据链路 | 当前用途 | 主要注意事项 |
|---|---|---|---|
| yfinance | Python → Yahoo Finance | 课程中的美股历史行情示例 | 非 Yahoo 官方 SDK；请求可能限流，接口行为会变化。 |
| AkShare `stock_us_daily` | Python → AkShare → 新浪财经美股接口 | Yahoo 不可用时的美股日线备用入口 | 与 Yahoo 的复权、字段、更新时间可能不同。 |
| AkShare `stock_zh_a_*` | Python → AkShare → 东方财富/新浪等 | A 股行情与基础数据 | 必须确认具体函数的数据源、频率、单位和复权方式。 |

“两个接口都返回 AAPL”不代表数据完全等价。实验必须记录数据来源、获取日期、市场、标的、时间区间、字段含义和复权口径，不能在同一回测中无说明地混用来源。

## 常见问题排查

| 现象 | 优先检查 | 处理方式 |
|---|---|---|
| `ModuleNotFoundError` | Notebook 的 `sys.executable` 是否指向 `pkm-quant` | 切换到 `Python (pkm-quant)`，不要先在系统 Python 重复安装。 |
| 终端与 Notebook 版本不同 | `python -V`、`which python`、内核路径 | 重新注册内核，并重启 Notebook 内核。 |
| `YFRateLimitError` / HTTP 429 | yfinance 版本、是否短时间重复请求 | 停止重试，稍后低频验证；必要时换用已注明来源的备用数据。 |
| `pip check` 报冲突 | 冲突包是否同时由 Conda 和 pip 管理 | 先修改 `environment.yml`，再统一同步；问题复杂时重建环境。 |
| 图表能运行但中文乱码 | Matplotlib 字体配置 | 在项目级绘图配置中指定可用中文字体，不改全局环境。 |
| 历史数据结果不一致 | 数据源、复权、时区和查询日期 | 固定数据快照并在实验报告中记录口径。 |

## 可复现实验清单

- 环境依赖写入 `environment.yml`，关键兼容版本明确固定。
- Notebook 明确使用 `Python (pkm-quant)` 内核。
- 实验报告记录 Python、主要库版本和运行日期。
- 数据报告记录来源、接口、获取日期、市场、标的、区间、频率、时区和复权。
- 数据清洗与接口兼容集中在 `实验/scripts/`，不要散落到每个 Notebook。
- 原始数据与处理后数据分开保存；正式比较优先使用可追溯的数据快照。
- 外部接口失败时保留错误类型，不把网络问题改写成策略或环境结论。

    if(a.y===b.y){
      var ax=a.x+a.w/2,bx=b.x+b.w/2,yy=a.y+ph;
      d='M'+ax+' '+yy+' C'+ax+' '+(yy+22)+' '+bx+' '+(yy+22)+' '+bx+' '+yy;
    }else{
      var top=a.y<b.y?a:b,bot=a.y<b.y?b:a;
      var tx=top.x+top.w/2,bx2=bot.x+bot.w/2,dy=(bot.y-top.y-ph)*0.35;
      d='M'+tx+' '+(top.y+ph)+' C'+tx+' '+(top.y+ph+dy)+' '+bx2+' '+(bot.y-dy)+' '+bx2+' '+bot.y;
    }
    s+='<path class="edge" data-a="'+attr(e[0])+'" data-b="'+attr(e[1])+'" d="'+d+'"/>';
  });
  seps.forEach(function(sp){
    s+='<text class="sep" x="24" y="'+(sp.y+16)+'">'+sp.label+'</text>';
    s+='<line class="sepline" x1="24" y1="'+(sp.y+23)+'" x2="'+(W-16)+'" y2="'+(sp.y+23)+'"/>';
  });
  layers.forEach(function(l){
    s+='<text class="lyr" x="24" y="'+(l.y+19)+'" data-id="'+attr(l.id)+'">'+l.label+'</text>';
  });
  Object.keys(pos).forEach(function(id){
    var p=pos[id],full=META[id]&&META[id].full;
    s+='<g class="pill '+(full?'full':'stub')+'" data-id="'+attr(id)+'"><rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+ph+'" rx="8"/><text x="'+(p.x+13)+'" y="'+(p.y+19)+'">'+(LABEL[id]||id)+(done[id]?'<tspan class="dk"> ✓</tspan>':'')+'</text></g>';
  });
  s+='</svg>';
  return '<section class="netwrap"><h2>知识网络</h2><p class="hint">自有量化体系九章：章为层、知识点为网点，课程内容不进此图。实心节点已成文，虚线节点只有边界说明；曲线是节点互引。悬停看关联，点击进入正文。</p><div class="netscroll">'+s+'</div><div class="netlegend"><span style="color:var(--accent)">▣ 已成文</span><span>▢ 待整理</span><span style="color:var(--ok)">✓ 已掌握</span><span style="color:var(--accent)">⌒ 交叉互引</span></div></section>';
}
function bindNet(){
  var svg=document.querySelector('#reader svg.net');if(!svg)return;
  function clear(){svg.classList.remove('hl');svg.querySelectorAll('.on').forEach(function(e){e.classList.remove('on');});}
  svg.querySelectorAll('.pill').forEach(function(p){
    var id=p.dataset.id;
    p.addEventListener('click',function(){navigateNode(id);});
    p.addEventListener('mouseenter',function(){
      clear();svg.classList.add('hl');p.classList.add('on');
      svg.querySelectorAll('.edge').forEach(function(ed){
        if(ed.dataset.a===id||ed.dataset.b===id){
          ed.classList.add('on');
          var other=ed.dataset.a===id?ed.dataset.b:ed.dataset.a;
          var op=svg.querySelector('.pill[data-id="'+other+'"]');if(op)op.classList.add('on');
        }
      });
    });
    p.addEventListener('mouseleave',clear);
  });
  svg.querySelectorAll('.lyr').forEach(function(t){
    t.addEventListener('click',function(){navigateNode(t.dataset.id);});
  });
}
function relatedHtml(id){
  if(id==="map")return '';
  var outs=[],ins=[];
  EDGES.forEach(function(e){
    if(e[0]===id&&outs.indexOf(e[1])<0)outs.push(e[1]);
    if(e[1]===id&&ins.indexOf(e[0])<0)ins.push(e[0]);
  });
  if(!outs.length&&!ins.length)return '';
  function chips(a){return a.map(function(n){return '<a class="xref" href="'+attr(routeUrl(n))+'" data-node="'+attr(n)+'">'+(LABEL[n]||n)+'</a>';}).join('');}
  var h='<hr><section class="rel"><h3>知识网络</h3>';
  if(outs.length)h+='<div class="relrow"><span class="relk">本文引用</span><span class="relchips">'+chips(outs)+'</span></div>';
  if(ins.length)h+='<div class="relrow"><span class="relk">被引用</span><span class="relchips">'+chips(ins)+'</span></div>';
  return h+'</section>';
}
function frameworkOverviewHtml(){
  const steps=[
    ["1. 理解市场","标的、订单、仓位","明确真实交易约束"],
    ["2. 准备数据","行情、收益、时点","保证证据可用"],
    ["3. 提出假设","现象、机制、规则","形成可证伪问题"],
    ["4. 回测评价","因果、成本、基准","检验是否稳健"],
    ["5. 风险执行","组合、风控、监控","进入下一轮复盘"],
  ];
  return '<section class="featuremap"><div class="featureflow">'+steps.map(function(s){return '<div class="featurestep"><strong>'+s[0]+'</strong><span>'+s[1]+'</span><span>'+s[2]+'</span></div>';}).join('')+'</div></section>';
}
function scrollToAnchor(anchor,smooth){
  const rd=document.getElementById("reader");
  const hs=rd.querySelectorAll("h1,h2,h3,h4");
  for(let i=0;i<hs.length;i++){
    if(hs[i].textContent.indexOf(anchor)>=0){hs[i].scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});return true;}
  }
  return false;
}
function finishScroll(anchor,opts){
  const y=opts&&typeof opts.scroll==="number"?opts.scroll:null;
  const restore=!!(opts&&opts.restore);
  const run=function(){
    if(anchor){if(!scrollToAnchor(anchor,!restore))setScrollY(0);}
    else if(y!==null){setScrollY(y);}
    else{setScrollY(0);}
  };
  run();setTimeout(run,80);setTimeout(run,250);
}
function renderNode(id,anchor,opts){
  const nd=NODES[id];
  const rd0=document.getElementById("reader");
  if(nd&&nd.embed){
    currentRoute={id:id,anchor:""};
    rd0.classList.add("wide");rd0.classList.add("embed");
    rd0.innerHTML='<div class="rdrhead"><a class="markbtn" style="text-decoration:none" href="'+attr(nd.embed)+'" target="_blank" rel="noopener">在新标签页打开 ↗</a></div><iframe class="pageframe" src="'+attr(nd.embed)+'" title="'+attr(LABEL[id]||id)+'"></iframe>';
    revealNode(id);
    document.querySelectorAll('.tnode').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
    setScrollY(0);
    return;
  }
  rd0.classList.remove("embed");
  let body=CONTENT[id];
  if(!body) body="# "+(LABEL[id]||id)+"\n\n> 🚧 本知识点待编写。";
  currentRoute={id:id,anchor:anchor||""};
  const isDone=!!done[id];
  const rd=document.getElementById("reader");
  rd.classList.toggle("wide",["map","refs","coursecompare","dwq"].indexOf(id)>=0);
  rd.innerHTML='<div class="rdrhead"><button class="markbtn '+(isDone?'done':'')+'" onclick="toggleDone(\''+id+'\',this)">'+(isDone?'✓ 已掌握':'标记已掌握')+'</button></div>'+(id==="map"?overviewHtml():"")+(id==="framework"?frameworkOverviewHtml():"")+md(body)+relatedHtml(id);
  bindXrefs();
  if(id==="map")bindNet();
  typeset(function(){finishScroll(anchor,opts||{});});
  revealNode(id);
  document.querySelectorAll('.tnode').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
}
function navigateNode(id,anchor){
  saveCurrentState();
  const st={id:id,anchor:anchor||"",scroll:0};
  history.pushState(st,"",routeUrl(id,anchor));
  renderNode(id,anchor);
}
function openNode(id,anchor){
  navigateNode(id,anchor);
}
function toggleDone(id,btn){
  const st=currentState();
  done[id]=!done[id]; if(!done[id])delete done[id];
  localStorage.setItem("quantkb_done",JSON.stringify(done));
  buildTree();bind();updateProg();
  history.replaceState(st,"",location.href);
  renderNode(id,st.anchor,{scroll:st.scroll,restore:true});
}
function updateProg(){
  const groups=['map','refs','c365','dwq','framework','market','datareturns','strategy','backtest','riskportfolio','execution','advanced','practice'];
  const ids=Object.keys(LABEL).filter(i=>groups.indexOf(i)<0&&!HREF[i]);
  const d=ids.filter(i=>done[i]).length;
  document.getElementById("prog").textContent='已掌握 '+d+'/'+ids.length;
}
function bind(){
  document.querySelectorAll('.tnode').forEach(el=>{
    el.onclick=function(e){e.stopPropagation();const id=el.dataset.id;
      if(el.dataset.href){location.href=el.dataset.href;return;}
      const kidsBox=document.querySelector('[data-kids="'+id+'"]');
      if(kidsBox){const showing=kidsBox.style.display!=='none';kidsBox.style.display=showing?'none':'';el.querySelector('.cv').classList.toggle('open',!showing);}
      navigateNode(id);
    };
  });
}
window.addEventListener("popstate",function(e){
  const st=e.state||routeFromHash()||{id:"map",anchor:"",scroll:0};
  renderNode(st.id,st.anchor||"",{scroll:st.scroll||0,restore:true});
});
window.addEventListener("scroll",rememberScroll,{passive:true});
document.getElementById("reader").addEventListener("scroll",rememberScroll,{passive:true});
buildTree();bind();updateProg();
const initial=routeFromHash()||{id:"map",anchor:"",scroll:0};
history.replaceState({id:initial.id,anchor:initial.anchor||"",scroll:0},"",location.href);
renderNode(initial.id,initial.anchor||"",{scroll:initial.scroll||0,restore:true});
</script>
</body>
